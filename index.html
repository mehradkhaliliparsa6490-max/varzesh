<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>لیگ ورزش‌ها - با دیباگ</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-1:#070b14;--bg-2:#0d1526;--surface:rgba(255,255,255,.05);--surface-2:rgba(255,255,255,.09);--border:rgba(255,255,255,.10);--text:#e9eefb;--muted:#8ea0bf;--accent:#4ade80;--accent-2:#22d3ee;--danger:#f87171;--warning:#fbbf24;--panel:#101827;--panel-2:#0c1322;--modal-bg:linear-gradient(165deg,#131c30,#0b1220);--shadow:0 22px 55px rgba(0,0,0,.5);--ring:rgba(74,222,128,.18)}
html[data-theme="light"]{--bg-1:#eef2f9;--bg-2:#dde5f3;--surface:rgba(255,255,255,.72);--surface-2:rgba(255,255,255,.95);--border:rgba(15,23,42,.10);--text:#0f172a;--muted:#5c6b88;--accent:#16a34a;--accent-2:#0891b2;--danger:#dc2626;--panel:#fff;--panel-2:#f4f7fc;--modal-bg:linear-gradient(165deg,#fff,#f2f6fd);--shadow:0 18px 45px rgba(15,23,42,.14);--ring:rgba(22,163,74,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Vazirmatn',ui-sans-serif,system-ui,sans-serif;color:var(--text);background-color:var(--bg-1);background-image:radial-gradient(1000px 620px at 12% -12%,rgba(74,222,128,.16),transparent 60%),radial-gradient(900px 520px at 92% -5%,rgba(34,211,238,.14),transparent 58%),linear-gradient(160deg,var(--bg-1),var(--bg-2));background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[data-theme="light"] body{background-image:radial-gradient(1000px 620px at 12% -12%,rgba(34,197,94,.14),transparent 60%),radial-gradient(900px 520px at 92% -5%,rgba(6,182,212,.14),transparent 58%),linear-gradient(160deg,var(--bg-1),var(--bg-2))}
button,input,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:20px}
.app{max-width:1020px;margin:0 auto;padding:14px 14px calc(60px + env(safe-area-inset-bottom))}

/* ===== DEBUG PANEL ===== */
.debug-panel{position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-family:monospace;font-size:.7rem;padding:10px;max-height:45vh;overflow-y:auto;z-index:9999;border-top:2px solid #0f0;transform:translateY(100%);transition:transform .3s;direction:ltr;text-align:left}
.debug-panel.open{transform:translateY(0)}
.debug-panel .dbg-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #0f0;position:sticky;top:-10px;background:#000;padding-top:4px}
.debug-panel .dbg-head h3{font-size:.85rem;color:#0f0;font-family:'Vazirmatn',sans-serif;direction:rtl}
.debug-panel .dbg-head button{background:#0f0;color:#000;border:0;padding:4px 10px;border-radius:4px;font-weight:800;cursor:pointer;font-size:.7rem;margin-inline-start:4px}
.debug-log{line-height:1.5;white-space:pre-wrap;word-break:break-all}
.debug-log .row{padding:3px 0;border-bottom:1px dashed #333}
.debug-log .ok{color:#0f0}
.debug-log .warn{color:#ff0}
.debug-log .err{color:#f44}
.debug-log .info{color:#0cf}
.debug-log .time{color:#888;font-size:.65rem;margin-inline-end:6px}
.debug-toggle{position:fixed;bottom:20px;left:20px;z-index:9998;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;border:0;font-size:22px;cursor:pointer;box-shadow:0 8px 22px rgba(34,211,238,.4);display:grid;place-items:center;font-weight:900}
.debug-toggle.has-error{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(248,113,113,.4)}50%{box-shadow:0 8px 32px rgba(248,113,113,.8)}}

/* ===== ONLINE BADGES ===== */
.status-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;position:relative;z-index:5}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:12px;font-size:.72rem;font-weight:800;border:1px solid var(--border);background:var(--surface-2)}
.status-chip.online{background:linear-gradient(135deg,rgba(74,222,128,.2),rgba(34,211,238,.15));color:var(--accent);border-color:rgba(74,222,128,.4)}
.status-chip.offline{background:linear-gradient(135deg,rgba(248,113,113,.2),rgba(220,38,38,.15));color:var(--danger);border-color:rgba(248,113,113,.4)}
.status-chip.count{background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(74,222,128,.15));color:var(--accent-2);border-color:rgba(34,211,238,.4)}
.status-chip.server{background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(139,92,246,.15));color:#a78bfa;border-color:rgba(168,85,247,.4)}
.status-chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

.sync-badge{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;padding:6px 14px;border-radius:20px;font-size:.72rem;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.sync-badge.show{opacity:1}
.sync-badge.online{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017}
.sync-badge.offline{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(20px);box-shadow:var(--shadow);position:sticky;top:8px;z-index:60}
.brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer;flex:1}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#4ade80,#22d3ee)}
.brand-text{min-width:0}
.brand-text h1{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text p{font-size:.7rem;color:var(--muted);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.server-pill{display:inline-block;font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:7px;background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(139,92,246,.2));color:#c4b5fd;margin-inline-start:6px}
.top-actions{display:flex;gap:6px;flex:0 0 auto}
.icon-btn{width:42px;height:42px;border-radius:13px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface-2);font-size:17px;cursor:pointer;display:grid;place-items:center}
.icon-btn.sm{width:36px;height:36px;font-size:15px;border-radius:11px}
.icon-btn.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(74,222,128,.2),rgba(34,211,238,.16))}
#logoutTopBtn{display:none}#logoutTopBtn.show{display:grid;color:var(--danger)}
.tabs{display:flex;gap:5px;margin:14px 0;padding:5px;border-radius:16px;background:var(--surface);border:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:88px;padding:11px 10px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:.84rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,rgba(74,222,128,.2),rgba(34,211,238,.16));color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.section{margin-bottom:18px}
.section-title{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.03em;margin:0 4px 10px;display:flex;align-items:center;gap:7px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;backdrop-filter:blur(18px);box-shadow:var(--shadow);position:relative;z-index:1;overflow:hidden}
.hint-box{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(74,222,128,.06));border:1px solid rgba(34,211,238,.2);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:.82rem;line-height:1.7}
.hint-box b{color:var(--accent-2)}
.sports-hero{text-align:center;padding:22px 12px 20px}
.sports-hero h2{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sports-hero p{font-size:.84rem;color:var(--muted);font-weight:500}
.sports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.sport-card{position:relative;padding:20px 14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:22px;cursor:pointer;transition:.28s;text-align:center;overflow:hidden;box-shadow:var(--shadow)}
.sport-card::before{content:'';position:absolute;inset:0;background:radial-gradient(300px 200px at 50% 0%,var(--sport-color,var(--accent)),transparent 70%);opacity:.14;pointer-events:none}
.sport-card:hover{transform:translateY(-4px);border-color:var(--sport-color,var(--accent))}
.sport-icon{font-size:42px;display:block;margin-bottom:10px;position:relative}
.sport-name{font-size:1rem;font-weight:800;margin-bottom:8px;position:relative}
.sport-type-badge{display:inline-block;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--surface-2);color:var(--muted);position:relative}
.sport-meta{font-size:.72rem;color:var(--muted);font-weight:600;display:flex;justify-content:center;gap:10px;position:relative;margin-top:8px;flex-wrap:wrap}
.sport-header{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;z-index:1}
.sport-header::before{content:'';position:absolute;inset:0;background:radial-gradient(500px 200px at 0% 50%,var(--sport-color,var(--accent)),transparent 70%);opacity:.13;pointer-events:none}
.back-btn{width:42px;height:42px;border-radius:13px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface-2);font-size:18px;cursor:pointer;display:grid;place-items:center;position:relative}
.sport-header-icon{font-size:34px;flex:0 0 auto;position:relative}
.sport-header-info{min-width:0;flex:1;position:relative}
.sport-header-info h2{font-size:1.08rem;font-weight:800;line-height:1.3}
.sport-header-info p{font-size:.72rem;color:var(--muted);margin-top:3px;font-weight:600}
.table-wrap{border-radius:20px;border:1px solid var(--border);background:var(--panel);overflow-x:auto;box-shadow:var(--shadow);position:relative;z-index:1}
table{width:100%;border-collapse:collapse;min-width:440px}
thead th{background:var(--panel-2);font-size:.72rem;font-weight:700;color:var(--muted);padding:13px 8px;text-align:center;white-space:nowrap}
thead th:first-child{width:56px}
thead th:nth-child(2){text-align:start;padding-inline-start:14px}
tbody td{padding:13px 8px;text-align:center;white-space:nowrap;font-size:.88rem;font-weight:600;border-top:1px solid var(--border);background:var(--panel)}
tbody td:nth-child(2){text-align:start;padding-inline-start:14px;font-weight:700}
.rank-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:10px;font-size:.78rem;font-weight:800;background:var(--surface-2);color:var(--muted)}
.team-cell{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.pts{color:var(--accent);font-weight:800}
.big-score{font-size:1.05rem;font-weight:800;color:var(--accent-2)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:20px}
.empty .ico{font-size:42px;display:block;margin-bottom:12px;opacity:.7}
.match-list{display:flex;flex-direction:column;gap:9px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:13px;position:relative;z-index:1}
.m-team{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.m-team.a{justify-content:flex-start}.m-team.b{justify-content:flex-end}
.m-score{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.95rem;padding:6px 12px;border-radius:10px;background:var(--surface-2);white-space:nowrap}
.m-score .win{color:var(--accent)}
.m-winner-badge{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:8px;background:linear-gradient(135deg,rgba(74,222,128,.25),rgba(34,211,238,.2));white-space:nowrap}
.score-preview{display:flex;align-items:center;gap:4px;font-size:.65rem;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(34,211,238,.12);color:var(--accent-2);white-space:nowrap;border:1px solid rgba(34,211,238,.22)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.74rem;font-weight:700;color:var(--muted)}
.input{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);font-size:.92rem;font-weight:500;outline:none;min-width:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;text-align:center;font-weight:700}
.row-form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}
.btn{border:1px solid var(--border);border-radius:13px;padding:12px 18px;font-size:.88rem;font-weight:700;cursor:pointer;white-space:nowrap;background:var(--surface-2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;z-index:1}
.btn.primary{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;border-color:transparent;box-shadow:0 8px 22px rgba(34,211,238,.28)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--danger);border-color:rgba(248,113,113,.3)}
.btn.danger:disabled{opacity:.35;cursor:not-allowed}
.btn.danger-solid{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-color:transparent}
.btn.block{width:100%}.btn.sm{padding:9px 12px;font-size:.8rem;border-radius:11px;min-width:38px}
.team-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--border)}
.team-row:first-child{border-top:0}
.color-pick-btn{width:42px;height:42px;border-radius:12px;flex:0 0 auto;border:2px solid var(--border);cursor:pointer;padding:0;position:relative;overflow:hidden}
.color-pick-btn::after{content:'🎨';position:absolute;inset:0;display:grid;place-items:center;font-size:14px;opacity:0;transition:.2s;background:rgba(0,0,0,.35)}
.color-pick-btn:hover::after{opacity:1}
.member-btn{width:42px;height:42px;border-radius:12px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface-2);font-size:16px;cursor:pointer;display:grid;place-items:center;position:relative}
.member-btn .badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;font-size:.62rem;font-weight:800;display:grid;place-items:center}
.rr-list{display:flex;flex-direction:column}
.rr-row{display:grid;grid-template-columns:minmax(0,1fr) 44px 12px 44px minmax(0,1fr) auto;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.rr-row:first-child{border-top:0}
.rr-row.played{background:linear-gradient(90deg,rgba(74,222,128,.09) 0%,transparent 30%,transparent 70%,rgba(74,222,128,.09) 100%);border-radius:12px;padding-inline:8px;margin-inline:-8px}
.rr-team{font-size:.86rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.rr-team.home{justify-content:flex-end}.rr-team.away{justify-content:flex-start}
.rr-team .tdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.rr-score{width:44px;height:40px;padding:4px;text-align:center;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:800;font-size:.95rem;outline:none;font-family:inherit}
.rr-score:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.rr-vs{text-align:center;font-weight:800;color:var(--muted);font-size:.8rem}
.rr-actions{display:flex;gap:4px;flex:0 0 auto}
.rr-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0}
.rr-btn.save{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;border-color:transparent}
.rr-btn.clear{color:var(--danger)}
.wr-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.wr-row:first-child{border-top:0}
.wr-row.played{background:linear-gradient(90deg,rgba(74,222,128,.09) 0%,transparent 30%,transparent 70%,rgba(74,222,128,.09) 100%);border-radius:12px;padding-inline:8px;margin-inline:-8px}
.wr-name{font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:5px}
.wr-name.home{justify-content:flex-end}.wr-name.away{justify-content:flex-start}
.wr-name .tdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.wr-choice{display:flex;gap:6px;flex-wrap:nowrap}
.wr-chip{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);padding:9px 12px;border-radius:11px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.wr-chip.on{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;border-color:transparent}
.wr-chip.on-draw{background:linear-gradient(135deg,#facc15,#fb923c);color:#3a1d02;border-color:transparent}
.solo-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.solo-row:first-child{border-top:0}
.solo-score-input{width:80px;padding:10px;text-align:center;font-weight:800;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:.95rem;outline:none}
.rank-medal{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;font-size:1.1rem;font-weight:800;background:var(--surface-2)}
.rank-medal.g1{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#221604}
.rank-medal.g2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#0f172a}
.rank-medal.g3{background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff}
.admin-sport-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:14px 4px;border-top:1px solid var(--border)}
.admin-sport-row:first-child{border-top:0}
.admin-sport-icon{font-size:26px;flex:0 0 auto;width:42px;text-align:center}
.admin-sport-info{min-width:0}
.admin-sport-info h4{font-size:.92rem;font-weight:800;line-height:1.3}
.admin-sport-info p{font-size:.7rem;color:var(--muted);margin-top:3px;font-weight:500}
.toggle{position:relative;width:52px;height:30px;flex:0 0 auto;border-radius:15px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;padding:0}
.toggle::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.25s}
.toggle.on{background:linear-gradient(135deg,#4ade80,#22d3ee);border-color:transparent}
.toggle.on::after{inset-inline-start:27px;background:#fff}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:4px;margin-top:4px}
.palette-color{width:100%;aspect-ratio:1;border-radius:14px;border:2px solid transparent;cursor:pointer;position:relative;padding:0}
.palette-color.active{border-color:var(--text);transform:scale(1.05)}
.palette-color.active::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.4rem;text-shadow:0 2px 6px rgba(0,0,0,.55)}
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.member-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.member-card-head{display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--border)}
.member-card-head .name{font-size:.9rem;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<body>

<div class="sync-badge" id="syncBadge"></div>

<button class="debug-toggle" id="debugToggle" title="پنل دیباگ">🐞</button>

<div class="debug-panel" id="debugPanel">
  <div class="dbg-head">
    <h3>🐞 پنل دیباگ - وضعیت زنده</h3>
    <div>
      <button data-dbg-action="clear">پاک کردن</button>
      <button data-dbg-action="close">بستن</button>
    </div>
  </div>
  <div class="debug-log" id="debugLog"></div>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand" data-action="goHome">
      <div class="logo">🏆</div>
      <div class="brand-text">
        <h1 id="brandTitle">لیگ ورزش‌ها</h1>
        <p id="brandSub">مدیریت نتایج مسابقات</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" data-action="openGuide" title="راهنما">❓</button>
      <button class="icon-btn" data-action="logout" id="logoutTopBtn" title="خروج">🚪</button>
      <button class="icon-btn" data-action="adminShortcut" id="adminTopBtn" title="مدیریت">🔒</button>
      <button class="icon-btn" data-action="openSettings" title="تنظیمات">⚙️</button>
    </div>
  </header>

  <div class="status-bar" id="statusBar"></div>

  <nav class="tabs" id="tabs" style="display:none"></nav>
  <main id="view"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============================================
   DEBUG LOGGER
   ============================================ */
const DEBUG = {
  logs: [],
  max: 300,
  hasError: false,
  add(type, msg, data){
    const time = new Date().toLocaleTimeString('en-GB');
    const entry = { time, type, msg, data, ts: Date.now() };
    this.logs.push(entry);
    if(this.logs.length > this.max) this.logs.shift();
    if(type === 'err') this.hasError = true;
    this.render();
    // هم توی console بزن
    const prefix = '[' + time + '][' + type.toUpperCase() + ']';
    if(type === 'err') console.error(prefix, msg, data || '');
    else if(type === 'warn') console.warn(prefix, msg, data || '');
    else if(type === 'ok') console.log('%c' + prefix + ' ' + msg, 'color:#0f0', data || '');
    else console.log(prefix, msg, data || '');
  },
  ok(msg, d){ this.add('ok', msg, d); },
  info(msg, d){ this.add('info', msg, d); },
  warn(msg, d){ this.add('warn', msg, d); },
  err(msg, d){ this.add('err', msg, d); },
  clear(){ this.logs = []; this.hasError = false; this.render(); this.updateBtn(); },
  render(){
    const el = document.getElementById('debugLog');
    if(!el) return;
    el.innerHTML = this.logs.slice().reverse().map(l => {
      const cls = l.type === 'ok' ? 'ok' : l.type === 'warn' ? 'warn' : l.type === 'err' ? 'err' : 'info';
      let extra = '';
      if(l.data){
        try { extra = ' | ' + (typeof l.data === 'object' ? JSON.stringify(l.data) : l.data); }
        catch(e){ extra = ' | [object]'; }
      }
      return '<div class="row ' + cls + '"><span class="time">' + l.time + '</span>[' + l.type.toUpperCase() + '] ' + String(l.msg) + extra + '</div>';
    }).join('') || '<div class="info">هیچ لاگی نیست</div>';
    this.updateBtn();
  },
  updateBtn(){
    const btn = document.getElementById('debugToggle');
    if(!btn) return;
    btn.classList.toggle('has-error', this.hasError);
    const errCount = this.logs.filter(l => l.type === 'err').length;
    btn.textContent = errCount > 0 ? '🐞' + errCount : '🐞';
  }
};

// کلیک روی دکمه دیباگ
document.getElementById('debugToggle').addEventListener('click', () => {
  document.getElementById('debugPanel').classList.toggle('open');
});
document.querySelectorAll('[data-dbg-action]').forEach(b => {
  b.addEventListener('click', () => {
    const a = b.dataset.dbgAction;
    if(a === 'clear') DEBUG.clear();
    if(a === 'close') document.getElementById('debugPanel').classList.remove('open');
  });
});

// خطاهای سراسری رو بگیر
window.addEventListener('error', e => DEBUG.err('خطای سراسری', e.message));
window.addEventListener('unhandledrejection', e => DEBUG.err('Promise رد شد', e.reason ? String(e.reason) : 'نامعلوم'));

DEBUG.info('🚀 شروع راه‌اندازی اپ');

/* ============================================
   CONFIG
   ============================================ */
const ADMIN_PASS = 'Aa64906490';
const MAX_TEAMS = 10;
const MIN_TEAMS = 2;
const MAX_MEMBERS = 15;
const STORAGE_KEY = 'sports-league-v11';
const SERVER_KEY = 'league-server-choice';

/* ============ SUPABASE ============ */
const SUPABASE_URL = 'https://lwpyainlxrthddlockia.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3cHlhaW5seHJ0aGRkbG9ja2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MzkxMTEsImV4cCI6MjEwNzExNTExMX0.foNhrL2xdYG9_q58VO8f_Lb076S6Swi8TML-z5Ky2pg';
let supabaseClient = null;

DEBUG.info('در حال ساخت Supabase Client...');
try {
  if(!window.supabase){
    DEBUG.err('کتابخانه Supabase لود نشد! احتمالاً CDN فیلتره یا اینترنت قطعه');
  } else {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });
    DEBUG.ok('✅ Supabase Client ساخته شد', { url: SUPABASE_URL.slice(0, 40) + '...' });
  }
} catch(e) {
  DEBUG.err('ساخت Supabase با خطا مواجه شد', e.message);
}

/* ============ SERVERS ============ */
const SERVERS = [
  { id: 'server1', name: 'سرور ۱', icon: '🟢', hint: 'عمومی - گروه اول' },
  { id: 'server2', name: 'سرور ۲', icon: '🔵', hint: 'عمومی - گروه دوم' },
  { id: 'server3', name: 'سرور ۳', icon: '🟣', hint: 'عمومی - گروه سوم' }
];
let currentServerId = 'server1';
try { const s = localStorage.getItem(SERVER_KEY); if(s && SERVERS.find(x => x.id === s)) currentServerId = s; } catch(e){}
const getServerName = id => (SERVERS.find(x => x.id === id) || SERVERS[0]).name;

DEBUG.info('سرور فعلی: ' + currentServerId);

/* ============ ONLINE + CHANNELS ============ */
let _presenceChannel = null;
let _broadcastChannel = null;
let _onlineCount = 0;
let _connectionStatus = 'connecting'; // connecting | online | offline
const _myClientId = 'u-' + Math.random().toString(36).slice(2, 10);
DEBUG.info('شناسه من: ' + _myClientId);

function updateStatusBar(){
  const bar = document.getElementById('statusBar');
  if(!bar) return;
  const statusText = _connectionStatus === 'online' ? '✅ متصل' : _connectionStatus === 'offline' ? '❌ قطع' : '⏳ در حال اتصال';
  const statusClass = _connectionStatus === 'online' ? 'online' : _connectionStatus === 'offline' ? 'offline' : 'server';
  bar.innerHTML =
    '<div class="status-chip ' + statusClass + '"><span class="dot"></span>' + statusText + '</div>' +
    '<div class="status-chip count">👥 ' + _onlineCount + ' نفر آنلاین (این سرور)</div>' +
    '<div class="status-chip server">🌐 ' + getServerName(currentServerId) + '</div>' +
    (supabaseClient ? '<div class="status-chip online">☁️ Supabase</div>' : '<div class="status-chip offline">⚠️ بدون Supabase</div>');
}

function setConnectionStatus(s){
  if(_connectionStatus === s) return;
  _connectionStatus = s;
  DEBUG.info('وضعیت اتصال: ' + s);
  updateStatusBar();
}

function setupChannels(){
  if(!supabaseClient){ DEBUG.warn('بدون Supabase نمی‌تونم کانال بسازم'); return; }
  DEBUG.info('در حال راه‌اندازی کانال‌ها...');
  if(_presenceChannel){ try { supabaseClient.removeChannel(_presenceChannel); } catch(e){} _presenceChannel = null; }
  if(_broadcastChannel){ try { supabaseClient.removeChannel(_broadcastChannel); } catch(e){} _broadcastChannel = null; }

  // Presence
  DEBUG.info('ساخت کانال Presence برای سرور: ' + currentServerId);
  _presenceChannel = supabaseClient.channel('online-' + currentServerId, {
    config: { presence: { key: _myClientId } }
  });
  _presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const st = _presenceChannel.presenceState();
      const prevCount = _onlineCount;
      _onlineCount = Object.keys(st).length;
      if(prevCount !== _onlineCount) DEBUG.info('تعداد آنلاین تغییر کرد: ' + _onlineCount);
      updateStatusBar();
    })
    .subscribe(async (status, err) => {
      if(status === 'SUBSCRIBED'){
        DEBUG.ok('✅ Presence متصل شد');
        try {
          await _presenceChannel.track({ joined: new Date().toISOString(), server: currentServerId });
          DEBUG.ok('✅ خودم رو track کردم');
        } catch(e){ DEBUG.err('track کردن خطا داد', e.message); }
      } else if(status === 'CHANNEL_ERROR'){
        DEBUG.err('خطای Presence', err ? err.message : 'نامعلوم');
        setConnectionStatus('offline');
      } else if(status === 'TIMED_OUT'){
        DEBUG.warn('Presence تایم‌اوت شد');
      } else if(status === 'CLOSED'){
        DEBUG.warn('Presence بسته شد');
      }
    });

  // Broadcast
  DEBUG.info('ساخت کانال Broadcast برای سرور: ' + currentServerId);
  _broadcastChannel = supabaseClient.channel('sync-' + currentServerId);
  _broadcastChannel
    .on('broadcast', { event: 'state-update' }, (payload) => {
      DEBUG.info('📥 پیام Broadcast دریافت شد');
      if(!payload || !payload.payload){ DEBUG.warn('پیام خالی بود'); return; }
      if(payload.payload.sender === _myClientId){ DEBUG.info('پیام خودم بود، نادیده می‌گیرم'); return; }
      const v = validateState(payload.payload.state);
      if(v){
        state = v;
        try { localStorage.setItem(STORAGE_KEY + ':' + currentServerId, JSON.stringify(state)); } catch(e){}
        render();
        setConnectionStatus('online');
        showSyncBadge('online');
        DEBUG.ok('✅ حالت از Broadcast آپدیت شد');
      } else {
        DEBUG.err('داده Broadcast نامعتبر بود');
      }
    })
    .subscribe((status, err) => {
      if(status === 'SUBSCRIBED') DEBUG.ok('✅ Broadcast متصل شد');
      else if(status === 'CHANNEL_ERROR') DEBUG.err('خطای Broadcast', err ? err.message : 'نامعلوم');

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2) + Date.now());

function makeSport(def){
  const base = {
    id: def.id, name: def.name, icon: def.icon, type: def.type,
    unit: def.unit, unitPlural: def.unitPlural, active: !!def.active,
    teams: [], matches: [], winners: {}, soloScores: {}, ranks: {},
    mode: 'league', bracket: null, champion: null,
    sportKind: def.sportKind || 'team',
    showMembers: false, showCaptain: false, teamMembers: {}
  };
  if(def.type === 'score'){
    base.winPoints = def.winPoints ?? 3; base.drawPoints = def.drawPoints ?? 1;
    base.lossPoints = 0; base.allowDraw = def.allowDraw ?? true; base.maxScore = 99;
    base.scoreMode = def.scoreMode || 'simple';
    base.cleanWin = def.cleanWin || { winner: 3, loser: 0 };
    base.closeWin = def.closeWin || { winner: 2, loser: 1 };
    base.loserThreshold = def.loserThreshold ?? 0;
  }
  if(def.type === 'winner'){
    base.winPoints = def.winPoints ?? 3; base.drawPoints = def.drawPoints ?? 0;
    base.lossPoints = 0; base.allowDraw = def.allowDraw ?? false;
  }
  return base;
}

function defaultState(){
  const st = { sports:{}, settings:{ theme:'dark' } };
  SPORT_DEFS.forEach(d => { st.sports[d.id] = makeSport(d); });
  return st;
}

function validateSport(sp, def){
  if(!sp || typeof sp !== 'object') return makeSport(def);
  sp.id = def.id; sp.type = def.type;
  sp.name = sp.name || def.name; sp.icon = sp.icon || def.icon;
  sp.unit = sp.unit || def.unit; sp.unitPlural = sp.unitPlural || def.unitPlural;
  sp.active = !!sp.active;
  sp.teams = Array.isArray(sp.teams) ? sp.teams : [];
  sp.matches = Array.isArray(sp.matches) ? sp.matches : [];
  sp.winners = (sp.winners && typeof sp.winners === 'object') ? sp.winners : {};
  sp.soloScores = (sp.soloScores && typeof sp.soloScores === 'object') ? sp.soloScores : {};
  sp.ranks = (sp.ranks && typeof sp.ranks === 'object') ? sp.ranks : {};
  sp.mode = sp.mode === 'knockout' ? 'knockout' : 'league';
  sp.bracket = Array.isArray(sp.bracket) ? sp.bracket : null;
  sp.champion = sp.champion || null;
  sp.sportKind = sp.sportKind === 'individual' ? 'individual' : (def.sportKind || 'team');
  sp.showMembers = !!sp.showMembers; sp.showCaptain = !!sp.showCaptain;
  sp.teamMembers = (sp.teamMembers && typeof sp.teamMembers === 'object') ? sp.teamMembers : {};
  Object.keys(sp.teamMembers).forEach(tid => {
    const arr = sp.teamMembers[tid];
    if(!Array.isArray(arr)){ delete sp.teamMembers[tid]; return; }
    sp.teamMembers[tid] = arr.map(m => ({ id: m.id || uid(), name: String(m.name || '').trim().slice(0, 30), isCaptain: !!m.isCaptain })).filter(m => m.name);
  });
  if(def.type === 'score'){
    sp.winPoints = sp.winPoints ?? def.winPoints; sp.drawPoints = sp.drawPoints ?? def.drawPoints;
    sp.lossPoints = sp.lossPoints ?? 0; sp.allowDraw = sp.allowDraw ?? def.allowDraw;
    sp.maxScore = sp.maxScore ?? 99;
    sp.scoreMode = sp.scoreMode === 'byScore' ? 'byScore' : 'simple';
    sp.cleanWin = (sp.cleanWin && typeof sp.cleanWin === 'object') ? { winner: Number(sp.cleanWin.winner) || 0, loser: Number(sp.cleanWin.loser) || 0 } : (def.cleanWin || { winner: 3, loser: 0 });
    sp.closeWin = (sp.closeWin && typeof sp.closeWin === 'object') ? { winner: Number(sp.closeWin.winner) || 0, loser: Number(sp.closeWin.loser) || 0 } : (def.closeWin || { winner: 2, loser: 1 });
    sp.loserThreshold = Number.isFinite(Number(sp.loserThreshold)) ? Number(sp.loserThreshold) : 0;
  }
  if(def.type === 'winner'){
    sp.winPoints = sp.winPoints ?? def.winPoints; sp.drawPoints = sp.drawPoints ?? def.drawPoints;
    sp.lossPoints = sp.lossPoints ?? 0; sp.allowDraw = sp.allowDraw ?? def.allowDraw;
  }
  sp.teams.forEach((tm, i) => { if(!tm.color) tm.color = COLORS[i % COLORS.length]; });
  return sp;
}

function validateState(s){
  if(!s || typeof s !== 'object') return null;
  const st = { sports:{}, settings:Object.assign({theme:'dark'}, s.settings || {}) };
  SPORT_DEFS.forEach(def => { st.sports[def.id] = validateSport(s.sports && s.sports[def.id], def); });
  return st;
}

const save = () => {

  if(supabaseClient){
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(async () => {
      DEBUG.info('💾 در حال ذخیره در Supabase...');
      try {
        const nowIso = new Date().toISOString();
        const { error, status } = await supabaseClient.from('league_state').upsert({ id: currentServerId, data: state, updated_at: nowIso }, { onConflict: 'id' });
        if(error){
          DEBUG.err('❌ خطای ذخیره در Supabase', error.message + ' | code: ' + error.code + ' | status: ' + status);
          setConnectionStatus('offline');
          showSyncBadge('offline');
          return;
        }
        DEBUG.ok('✅ ذخیره در Supabase موفق', { status });
        _myLastSave = new Date(nowIso).getTime();
        _lastServerData = JSON.stringify(state);
        setConnectionStatus('online');
        showSyncBadge('online');
        if(_broadcastChannel){
          try {
            await _broadcastChannel.send({ type: 'broadcast', event: 'state-update', payload: { sender: _myClientId, state: state } });
            DEBUG.ok('📤 Broadcast ارسال شد');
          } catch(e){ DEBUG.warn('ارسال Broadcast خطا داد', e.message); }
        }
      } catch(e){
        DEBUG.err('❌ استثنا در ذخیره', e.message);
        setConnectionStatus('offline');
        showSyncBadge('offline');
      }
    }, 300);
  } else {
    DEBUG.warn('Supabase نیست، فقط localStorage');
  }
};

async function loadServer(serverId, silent){
  DEBUG.info('📥 در حال بارگذاری سرور ' + serverId);
  if(supabaseClient){
    try {
      const { data, error, status } = await supabaseClient.from('league_state').select('data').eq('id', serverId).maybeSingle();
      if(error){
        DEBUG.err('خطای خواندن از Supabase', error.message + ' | code: ' + error.code + ' | status: ' + status);
      } else if(!data){
        DEBUG.warn('داده‌ای برای سرور ' + serverId + ' پیدا نشد (اولین بازدیده)');
      } else if(data.data){
        const v = validateState(data.data);
        if(v){
          state = v;
          _lastServerData = JSON.stringify(state);
          try { localStorage.setItem(STORAGE_KEY + ':' + serverId, JSON.stringify(state)); } catch(e){}
          setConnectionStatus('online');
          DEBUG.ok('✅ داده سرور بارگذاری شد', { sports: Object.keys(v.sports).length });
          return true;
        } else {
          DEBUG.err('داده سرور نامعتبر بود');
        }
      }
    } catch(e){ DEBUG.err('استثنا در بارگذاری', e.message); }
  }
  // fallback
  try {
    const raw = localStorage.getItem(STORAGE_KEY + ':' + serverId);
    if(raw){
      const v = validateState(JSON.parse(raw));
      if(v){ state = v; DEBUG.ok('✅ از localStorage بارگذاری شد'); return true; }
    }
  } catch(e){ DEBUG.warn('خطای localStorage', e.message); }
  state = defaultState();
  DEBUG.warn('⚠️ حالت پیش‌فرض استفاده شد');
  return false;
}

/* ============ POLLING ============ */
async function pollServer(){
  if(!supabaseClient || document.hidden) return;
  try {
    const { data, error } = await supabaseClient.from('league_state').select('data, updated_at').eq('id', currentServerId).maybeSingle();
    if(error){ setConnectionStatus('offline'); return; }
    if(!data || !data.data){ setConnectionStatus('online'); return; }
    const serverStr = JSON.stringify(data.data);
    const serverTime = new Date(data.updated_at).getTime();
    setConnectionStatus('online');
    if(serverStr !== _lastServerData && serverTime > _myLastSave + 800){
      _lastServerData = serverStr;
      const v = validateState(data.data);
      if(v){
        state = v;
        try { localStorage.setItem(STORAGE_KEY + ':' + currentServerId, JSON.stringify(state)); } catch(e){}
        render();
        DEBUG.ok('🔄 Polling: آپدیت از سرور');
      }
    }
  } catch(e){ setConnectionStatus('offline'); }
}

function startPolling(){
  if(_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(pollServer, 3000);
  DEBUG.info('⏱️ Polling هر ۳ ثانیه فعال شد');
  setTimeout(pollServer, 800);
}

/* ============ STANDINGS ============ */
function standingsScore(sp){
  const st = {};
  sp.teams.forEach(tm => { st[tm.id] = { id:tm.id, name:tm.name, color:tm.color, p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0 }; });
  const byScore = sp.scoreMode === 'byScore', threshold = Number(sp.loserThreshold) || 0;
  const cw = sp.cleanWin || { winner: 3, loser: 0 };
  const clw = sp.closeWin || { winner: 2, loser: 1 };
  sp.matches.forEach(m => {
    const h = st[m.home], a = st[m.away]; if(!h || !a) return;
    h.p++; a.p++; h.gf += m.hg; h.ga += m.ag; a.gf += m.ag; a.ga += m.hg;
    if(m.hg > m.ag){
      h.w++; a.l++;
      if(byScore){ const c = m.ag <= threshold; const r = c ? cw : clw; h.pts += Number(r.winner)||0; a.pts += Number(r.loser)||0; }
      else { h.pts += sp.winPoints; a.pts += sp.lossPoints; }
    } else if(m.hg < m.ag){
      a.w++; h.l++;
      if(byScore){ const c = m.hg <= threshold; const r = c ? cw : clw; a.pts += Number(r.winner)||0; h.pts += Number(r.loser)||0; }
      else { a.pts += sp.winPoints; h.pts += sp.lossPoints; }
    } else { h.d++; a.d++; h.pts += sp.drawPoints; a.pts += sp.drawPoints; }
  });
  return Object.values(st).map(s => ({ ...s, gd: s.gf - s.ga })).sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.name.localeCompare(y.name, 'fa'));
}

function standingsWinner(sp){
  const st = {};
  sp.teams.forEach(tm => { st[tm.id] = { id:tm.id, name:tm.name, color:tm.color, p:0,w:0,d:0,l:0,pts:0 }; });
  Object.values(sp.winners || {}).forEach(res => {
    if(!res || !res.a || !res.b) return;
    const h = st[res.a], a = st[res.b]; if(!h || !a) return;
    h.p++; a.p++;
    if(res.winner === 'a'){ h.w++; a.l++; h.pts += sp.winPoints; a.pts += sp.lossPoints; }
    else if(res.winner === 'b'){ a.w++; h.l++; a.pts += sp.winPoints; h.pts += sp.lossPoints; }
    else { h.d++; a.d++; h.pts += sp.drawPoints; a.pts += sp.drawPoints; }
  });
  return Object.values(st).sort((x,y) => y.pts - x.pts || y.w - x.w || x.name.localeCompare(y.name, 'fa'));
}

const standingsRank = sp => sp.teams.map(tm => ({ id: tm.id, name: tm.name, color: tm.color, rank: Number(sp.ranks[tm.id]) || 9999, hasRank: sp.ranks[tm.id] != null && sp.ranks[tm.id] !== '' })).sort((x,y) => x.rank - y.rank || x.name.localeCompare(y.name, 'fa'));

/* ============ BRACKET ============ */
function getRoundName(teamCount, roundIndex){
  if(teamCount <= 2) return t('final');
  if(teamCount <= 4) return t('semiFinal');
  if(teamCount <= 8) return t('quarterFinal');
  if(teamCount <= 16) return t('roundOf16');
  return t('round') + ' ' + num(roundIndex + 1);
}

function generateBracket(sp){
  if(sp.teams.length < MIN_TEAMS) return false;
  const teams = sp.teams.slice();
  for(let i = teams.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [teams[i], teams[j]] = [teams[j], teams[i]]; }
  const n = teams.length, matches = [], byes = [];
  for(let i = 0; i < n; i += 2){
    if(i + 1 < n){ matches.push({ id: uid(), a: teams[i].id, b: teams[i+1].id, hg: null, ag: null, winner: null }); }
    else { byes.push(teams[i].id); }
  }
  sp.bracket = [{ name: getRoundName(n, 0), matches, byes }]; sp.champion = null; return true;
}

function ensureBracketRounds(sp){
  if(!sp.bracket || !sp.bracket.length) return;
  let safety = 0;
  while(safety < 20){
    safety++;
    const lastIdx = sp.bracket.length - 1, last = sp.bracket[lastIdx]; if(!last) break;
    if(last.matches.length === 0){ if(last.byes.length <= 1){ sp.champion = last.byes[0] || null; } break; }
    const allDone = last.matches.every(m => m.winner === 'a' || m.winner === 'b');
    if(!allDone) break;
    const winners = last.matches.map(m => m.winner === 'a' ? m.a : m.b);
    const nextTeams = [...winners, ...last.byes];
    if(nextTeams.length <= 1){ sp.champion = nextTeams[0] || null; break; }
    if(sp.bracket[lastIdx + 1]) break;
    const matches = [], byes = [];
    for(let i = 0; i < nextTeams.length; i += 2){
      if(i + 1 < nextTeams.length){ matches.push({ id: uid(), a: nextTeams[i], b: nextTeams[i+1], hg: null, ag: null, winner: null }); }
      else { byes.push(nextTeams[i]); }
    }
    sp.bracket.push({ name: getRoundName(nextTeams.length, sp.bracket.length), matches, byes });
  }
}

function renderAdminScore(sp){
  if(sp.mode === 'knockout') return renderAdminBracket(sp);
  const pairs = [];
  for(let i=0;i<sp.teams.length;i++) for(let j=i+1;j<sp.teams.length;j++){
    const a=sp.teams[i], b=sp.teams[j];
    const ex = sp.matches.find(m => (m.home===a.id && m.away===b.id) || (m.home===b.id && m.away===a.id));
    let hg='', ag='', matchId=null;
    if(ex){ matchId = ex.id; if(ex.home===a.id){ hg=ex.hg; ag=ex.ag; } else { hg=ex.ag; ag=ex.hg; } }
    pairs.push({a,b,hg,ag,matchId});
  }
  const playedCount = pairs.filter(p => p.matchId).length;
  const rows = pairs.length ? pairs.map(p => '<div class="rr-row ' + (p.matchId?'played':'') + '"><span class="rr-team home"><span>' + esc(p.a.name) + '</span><span class="tdot" style="background:' + esc(p.a.color) + '"></span></span><input class="rr-score" type="number" inputmode="numeric" min="0" max="' + sp.maxScore + '" value="' + (p.hg!==''?p.hg:'') + '" placeholder="–" data-score="hg" data-sport="' + sp.id + '"><span class="rr-vs">−</span><input class="rr-score" type="number" inputmode="numeric" min="0" max="' + sp.maxScore + '" value="' + (p.ag!==''?p.ag:'') + '" placeholder="–" data-score="ag" data-sport="' + sp.id + '"><span class="rr-team away"><span class="tdot" style="background:' + esc(p.b.color) + '"></span><span>' + esc(p.b.name) + '</span></span><div class="rr-actions"><button class="rr-btn save" data-action="savePair" data-sport="' + sp.id + '" data-a="' + p.a.id + '" data-b="' + p.b.id + '">✓</button>' + (p.matchId?'<button class="rr-btn clear" data-action="clearPair" data-sport="' + sp.id + '" data-id="' + p.matchId + '">✕</button>':'') + '</div></div>').join('') : '<p style="color:var(--muted);font-size:.85rem;padding:10px 0">' + esc(t('needTwoTeams')) + '</p>';
  return '<div class="section fade"><div class="section-title">🔐 ' + esc(t('adminPanel')) + '<span style="margin-inline-start:auto;font-weight:600;text-transform:none">' + num(playedCount) + ' / ' + num(pairs.length) + '</span></div>' + teamListBlock(sp) + '<div class="card"><div class="section-title" style="margin:0 0 12px">⚽ ' + esc(t('recordResults')) + '</div><div class="rr-list">' + rows + '</div></div></div>';
}

function renderAdminWinner(sp){
  if(sp.mode === 'knockout') return renderAdminBracket(sp);
  const pairs = [];
  for(let i=0;i<sp.teams.length;i++) for(let j=i+1;j<sp.teams.length;j++){
    const a=sp.teams[i], b=sp.teams[j], key = a.id + '|' + b.id;
    const res = sp.winners[key] || null;
    pairs.push({a,b,key,res});
  }
  const playedCount = pairs.filter(p => p.res).length;
  const rows = pairs.length ? pairs.map(p => {
    const r = p.res, isA = r && r.winner === 'a', isB = r && r.winner === 'b', isD = r && r.winner === 'draw';
    return '<div class="wr-row ' + (r?'played':'') + '"><span class="wr-name home"><span>' + esc(p.a.name) + '</span><span class="tdot" style="background:' + esc(p.a.color) + '"></span></span><div class="wr-choice"><button class="wr-chip ' + (isA?'on':'') + '" data-action="pickWinner" data-sport="' + sp.id + '" data-a="' + p.a.id + '" data-b="' + p.b.id + '" data-w="a">' + (isA?'🏆':'🏳️') + ' ' + esc(p.a.name) + '</button>' + (sp.allowDraw ? '<button class="wr-chip ' + (isD?'on-draw':'') + '" data-action="pickWinner" data-sport="' + sp.id + '" data-a="' + p.a.id + '" data-b="' + p.b.id + '" data-w="draw">🤝 ' + esc(t('draw')) + '</button>' : '') + '<button class="wr-chip ' + (isB?'on':'') + '" data-action="pickWinner" data-sport="' + sp.id + '" data-a="' + p.a.id + '" data-b="' + p.b.id + '" data-w="b">' + (isB?'🏆':'🏳️') + ' ' + esc(p.b.name) + '</button></div><span class="wr-name away"><span class="tdot" style="background:' + esc(p.b.color) + '"></span><span>' + esc(p.b.name) + '</span></span><div class="rr-actions">' + (r ? '<button class="rr-btn clear" data-action="clearWinner" data-sport="' + sp.id + '" data-key="' + p.key + '">✕</button>' : '') + '</div></div>';

function renderAdminBracket(sp){
  const canGenerate = sp.teams.length >= MIN_TEAMS;
  let bracketHtml = '';
  if(!sp.bracket || !sp.bracket.length){
    bracketHtml = '<div class="empty" style="padding:30px 20px"><span class="ico">🏆</span><p>' + esc(t('noBracket')) + '<br><span style="font-size:.78rem">' + esc(t('noBracketHint')) + '</span></p></div>';
  } else {
    bracketHtml = sp.bracket.map((round, ri) => {
      const matchRows = round.matches.map(m => {
        const a = teamById(sp, m.a), b = teamById(sp, m.b); if(!a || !b) return '';
        const isResolved = m.winner === 'a' || m.winner === 'b';
        const aCls = isResolved ? (m.winner === 'a' ? 'winner' : 'loser') : '';
        const bCls = isResolved ? (m.winner === 'b' ? 'winner' : 'loser') : '';
        return '<div class="bracket-match ' + (isResolved?'resolved':'') + '"><span class="bm-team a ' + aCls + '"><span>' + esc(a.name) + '</span><span class="tdot" style="background:' + esc(a.color) + '"></span></span><input class="bm-score" type="number" inputmode="numeric" min="0" max="99" value="' + (m.hg != null ? m.hg : '') + '" placeholder="–" data-bracket="hg" data-round="' + ri + '" data-match="' + m.id + '" data-sport="' + sp.id + '"><span class="bm-sep">−</span><input class="bm-score" type="number" inputmode="numeric" min="0" max="99" value="' + (m.ag != null ? m.ag : '') + '" placeholder="–" data-bracket="ag" data-round="' + ri + '" data-match="' + m.id + '" data-sport="' + sp.id + '"><span class="bm-team b ' + bCls + '"><span class="tdot" style="background:' + esc(b.color) + '"></span><span>' + esc(b.name) + '</span></span><div class="bm-actions"><button class="bm-btn save" data-action="bracketSave" data-sport="' + sp.id + '" data-round="' + ri + '" data-match="' + m.id + '">✓</button>' + (isResolved ? '<button class="bm-btn clear" data-action="bracketClear" data-sport="' + sp.id + '" data-round="' + ri + '" data-match="' + m.id + '">✕</button>' : '') + '</div></div>';
      }).join('');
      const byeRows = round.byes.map(teamId => { const tm = teamById(sp, teamId); return tm ? '<div class="bm-bye">⏭️ ' + esc(tm.name) + ' — ' + esc(t('bye')) + '</div>' : ''; }).join('');
      return '<div class="bracket-round"><div class="bracket-round-title">🏁 ' + esc(round.name) + '<span class="rr-count">' + num(round.matches.filter(m => m.winner).length) + ' / ' + num(round.matches.length) + '</span></div>' + (matchRows || '<p style="color:var(--muted);font-size:.82rem;padding:8px 4px">—</p>') + byeRows + '</div>';
    }).join('');
  }
  const championHtml = sp.champion ? (() => { const c = teamById(sp, sp.champion); if(!c) return ''; return '<div class="champion-box"><span class="trophy">🏆</span><h3>' + esc(t('champion')) + '</h3><div class="champion-name"><span class="tdot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</div></div>'; })() : '';
  const toolbar = sp.bracket && sp.bracket.length
    ? '<div class="bracket-toolbar"><button class="btn" data-action="generateBracket" data-sport="' + sp.id + '">🔄 ' + esc(t('regenerateBracket')) + '</button><button class="btn danger" data-action="deleteBracket" data-sport="' + sp.id + '">🗑️ ' + esc(t('deleteBracket')) + '</button></div>'
    : '<div class="bracket-toolbar"><button class="btn primary" data-action="generateBracket" data-sport="' + sp.id + '" ' + (canGenerate?'':'disabled') + '>🏆 ' + esc(t('generateBracket')) + '</button></div>';
  return '<div class="section fade"><div class="section-title">🔐 ' + esc(t('adminPanel')) + ' — ' + esc(t('modeKnockout')) + '</div><div class="hint-box">🏆 <b>' + esc(t('knockoutActive')) + ':</b> ' + esc(t('modeHint')) + '</div>' + teamListBlock(sp) + '<div class="card"><div class="section-title" style="margin:0 0 12px">🏆 ' + esc(t('tabBracket')) + '</div>' + toolbar + '<div class="bracket-wrap">' + bracketHtml + '</div>' + championHtml + '</div></div>';
}

function bindTeamForm(){
  const form = document.getElementById('teamForm'); if(!form) return;
  const sportId = form.dataset.sport;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const sp = getSport(sportId); if(!sp) return;
    const inp = document.getElementById('teamNameInput');
    const name = inp.value.trim();
    if(!name){ toast(t('enterTeamName')); return; }
    if(sp.teams.length >= MAX_TEAMS){ toast(t('maxTeams')); return; }
    if(sp.teams.some(x => x.name.trim().toLowerCase() === name.toLowerCase())){ toast(t('teamExists')); return; }
    sp.teams.push({ id: uid(), name, color: COLORS[sp.teams.length % COLORS.length] });
    DEBUG.ok('تیم اضافه شد: ' + name);
    save(); render(); toast(t('added'));
  });
}

/* ============ MEMBERS ============ */
function renderMembersModal(sportId, teamId){
  const sp = getSport(sportId); if(!sp) return '';
  const tm = sp.teams.find(x => x.id === teamId); if(!tm) return '';
  const members = sp.teamMembers[teamId] || [];
  const canAdd = members.length < MAX_MEMBERS;
  const rows = members.length ? members.map(m => '<div class="mm-row ' + (m.isCaptain && sp.showCaptain ? 'is-captain' : '') + '"><span class="dot" style="background:' + esc(tm.color) + '"></span><input class="mm-name-input" value="' + esc(m.name) + '" maxlength="30" data-member-rename="' + m.id + '" data-team="' + teamId + '" data-sport="' + sportId + '"><div class="mm-actions">' + (sp.showCaptain ? '<button class="mm-btn cap-toggle ' + (m.isCaptain?'on':'') + '" data-action="toggleCaptain" data-sport="' + sportId + '" data-team="' + teamId + '" data-member="' + m.id + '">⭐</button>' : '') + '<button class="mm-btn del" data-action="delMember" data-sport="' + sportId + '" data-team="' + teamId + '" data-member="' + m.id + '">✕</button></div></div>').join('') : '<div class="mm-empty">' + esc(t('noMembers')) + '</div>';
  return '<div class="modal-head"><h2>👥 ' + esc(t('manageMembers')) + '</h2><button class="icon-btn sm" data-action="closeModal">✕</button></div><p class="modal-sub"><b style="color:' + esc(tm.color) + '">●</b> ' + esc(tm.name) + (sp.showCaptain ? ' — <span style="color:var(--accent-2)">⭐ ' + esc(t('captain')) + '</span>' : '') + '</p><div class="members-modal-list">' + rows + '</div><div class="mm-counter">' + num(members.length) + ' / ' + num(MAX_MEMBERS) + ' — ' + esc(t('members')) + '</div>' + (canAdd ? '<form class="row-form" id="addMemberForm" data-sport="' + sportId + '" data-team="' + teamId + '" style="margin-top:14px"><input class="input" id="memberNameInput" maxlength="30" placeholder="' + esc(t('memberName')) + '"><button class="btn primary" type="submit">＋ ' + esc(t('addMember')) + '</button></form>' : '<p style="font-size:.78rem;color:var(--muted);margin:14px 0 8px">' + esc(t('maxMembers')) + '</p>') + '<button class="btn block" data-action="closeModal" style="margin-top:10px">' + esc(t('close')) + '</button>';
}

function openMembers(sportId, teamId){
  openModal(renderMembersModal(sportId, teamId));
  bindAddMemberForm();
}

function bindAddMemberForm(){
  const form = document.getElementById('addMemberForm'); if(!form) return;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const sportId = form.dataset.sport, teamId = form.dataset.team;
    const sp = getSport(sportId); if(!sp) return;
    if(!sp.teamMembers[teamId]) sp.teamMembers[teamId] = [];
    const list = sp.teamMembers[teamId];
    if(list.length >= MAX_MEMBERS){ toast(t('maxMembers')); return; }
    const inp = document.getElementById('memberNameInput');
    const name = inp.value.trim();
    if(!name){ toast(t('enterMemberName')); return; }
    if(list.some(m => m.name.trim().toLowerCase() === name.toLowerCase())){ toast(t('memberExists')); return; }
    list.push({ id: uid(), name, isCaptain: false });
    save(); openMembers(sportId, teamId); toast(t('memberAdded'));
  });
}

/* ============ HANDLERS ============ */
function handleSavePair(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  const row = btn.closest('.rr-row');
  const hgS = row.querySelector('[data-score="hg"]').value.trim();
  const agS = row.querySelector('[data-score="ag"]').value.trim();
  if(hgS === '' || agS === ''){ toast(t('fillScores')); return; }
  const hg = Math.max(0, Math.min(sp.maxScore || 99, parseInt(hgS,10)||0));
  const ag = Math.max(0, Math.min(sp.maxScore || 99, parseInt(agS,10)||0));
  const aId = btn.dataset.a, bId = btn.dataset.b;
  const ex = sp.matches.find(m => (m.home===aId && m.away===bId) || (m.home===bId && m.away===aId));
  if(ex){ if(ex.home===aId){ ex.hg=hg; ex.ag=ag; } else { ex.hg=ag; ex.ag=hg; } }
  else { sp.matches.push({ id: uid(), home: aId, away: bId, hg, ag }); }
  DEBUG.ok('نتیجه ذخیره شد: ' + hg + '-' + ag);
  save(); render(); toast(t('saved'));
}

function handleClearPair(btn){
  if(!confirm(t('confirmDeleteMatch'))) return;
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  sp.matches = sp.matches.filter(m => m.id !== btn.dataset.id);
  save(); render(); toast(t('deleted'));
}

function handlePickWinner(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  sp.winners[btn.dataset.a + '|' + btn.dataset.b] = { a: btn.dataset.a, b: btn.dataset.b, winner: btn.dataset.w };
  save(); render(); toast(t('saved'));
}

function handleClearWinner(btn){
  if(!confirm(t('confirmDeleteMatch'))) return;
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  delete sp.winners[btn.dataset.key];
  save(); render(); toast(t('deleted'));
}

function handleGenerateBracket(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  if(sp.teams.length < MIN_TEAMS){ toast(t('needTwoTeams')); return; }
  if(sp.bracket && sp.bracket.length && !confirm(t('confirmRegenerate'))) return;
  if(generateBracket(sp)){ DEBUG.ok('جدول حذفی ساخته شد برای: ' + sp.id); save(); render(); toast('🏆 ' + t('bracketGenerated')); }
}

function handleDeleteBracket(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  if(!confirm(t('confirmDeleteBracket'))) return;
  sp.bracket = null; sp.champion = null;
  save(); render(); toast('🗑️ ' + t('bracketDeleted'));
}

function handleBracketSave(btn){
  const sp = getSport(btn.dataset.sport); if(!sp || !sp.bracket) return;
  const ri = parseInt(btn.dataset.round, 10), mid = btn.dataset.match;
  const round = sp.bracket[ri]; if(!round) return;
  const match = round.matches.find(m => m.id === mid); if(!match) return;
  const row = btn.closest('.bracket-match');
  const hgS = row.querySelector('[data-bracket="hg"]').value.trim();
  const agS = row.querySelector('[data-bracket="ag"]').value.trim();
  if(hgS === '' || agS === ''){ toast(t('fillScores')); return; }
  const hg = Math.max(0, Math.min(99, parseInt(hgS,10)||0));
  const ag = Math.max(0, Math.min(99, parseInt(agS,10)||0));
  if(hg === ag){ toast(t('knockoutNoDraw')); return; }
  match.hg = hg; match.ag = ag; match.winner = hg > ag ? 'a' : 'b';
  ensureBracketRounds(sp);
  save(); render(); toast(t('saved'));
}

function handleBracketClear(btn){
  if(!confirm(t('confirmResetMatch'))) return;
  const sp = getSport(btn.dataset.sport); if(!sp || !sp.bracket) return;
  const ri = parseInt(btn.dataset.round, 10), mid = btn.dataset.match;
  const round = sp.bracket[ri]; if(!round) return;
  const match = round.matches.find(m => m.id === mid); if(!match) return;
  match.hg = null; match.ag = null; match.winner = null;
  sp.bracket = sp.bracket.slice(0, ri + 1);
  sp.champion = null;
  save(); render(); toast(t('deleted'));
}

function handleDeleteMember(btn){
  if(!confirm(t('confirmDeleteMember'))) return;
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  sp.teamMembers[btn.dataset.team] = (sp.teamMembers[btn.dataset.team] || []).filter(m => m.id !== btn.dataset.member);
  save(); openMembers(btn.dataset.sport, btn.dataset.team); toast(t('memberDeleted'));
}

function handleToggleCaptain(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  const list = sp.teamMembers[btn.dataset.team] || [];
  const tg = list.find(m => m.id === btn.dataset.member); if(!tg) return;
  if(tg.isCaptain){ tg.isCaptain = false; }
  else { list.forEach(m => m.isCaptain = false); tg.isCaptain = true; }
  save(); openMembers(btn.dataset.sport, btn.dataset.team); toast(t('captainSet'));
}

function handleLogout(){
  if(!confirm(t('confirmLogout'))) return;
  authed = false; currentView = 'sports'; currentSportId = null; currentTab = 'table';
  applySettings(); render(); window.scrollTo({top:0,behavior:'smooth'}); toast('🚪 ' + t('loggedOut'));
}

function handleDeleteAll(){
  if(!confirm(t('confirmDeleteAll'))) return;
  if(!confirm(t('confirmDeleteAll2'))) return;
  try { localStorage.removeItem(STORAGE_KEY + ':' + currentServerId); } catch(e){}
  state = defaultState();
  authed = false; currentView = 'sports'; currentSportId = null; currentTab = 'table';
  DEBUG.warn('🗑️ همه اطلاعات پاک شد');
  save(); closeModal(); applySettings(); render();
  window.scrollTo({top:0,behavior:'smooth'}); toast('🗑️ ' + t('allDataDeleted'));
}

async function handleSetServer(serverId){
  if(serverId === currentServerId){ closeModal(); return; }
  DEBUG.info('🔄 تعویض سرور به: ' + serverId);
  currentServerId = serverId;
  try { localStorage.setItem(SERVER_KEY, serverId); } catch(e){}
  closeModal();
  _lastServerData = null; _myLastSave = 0;
  await loadServer(serverId, true);
  applySettings(); render();
  setupChannels();
  toast('🌐 ' + t('serverChanged'));
}

  const el = e.target.closest('[data-action]'); if(!el) return;

  else if(a === 'openSport'){ currentSportId = el.dataset.id; currentView = 'sport'; currentTab = 'table'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a === 'sportTab'){ currentTab = el.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a === 'gotoAdmin'){ currentView = 'admin'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a === 'adminShortcut'){ if(authed){ currentView = 'admin'; render(); window.scrollTo({top:0,behavior:'smooth'}); } else openPassword(); }
  else if(a === 'openSettings'){ openSettings(); }
  else if(a === 'openGuide'){ openGuide(); }
  else if(a === 'closeModal'){ closeModal(); }
  else if(a === 'askPassword'){ openPassword(); }
  else if(a === 'setTheme'){ state.settings.theme = el.dataset.val; save(); applySettings(); openSettings(); }
  else if(a === 'setServer'){ handleSetServer(el.dataset.server); }
  else if(a === 'deleteAllData'){ handleDeleteAll(); }
  else if(a === 'openPalette'){ openPalette(el.dataset.sport, el.dataset.id); }
  else if(a === 'setColor'){ const sp = getSport(el.dataset.sport); if(!sp) return; const team = sp.teams.find(x => x.id === el.dataset.id); if(!team) return; team.color = el.dataset.color; save(); closeModal(); render(); toast(t('saved')); }
  else if(a === 'savePair'){ handleSavePair(el); }
  else if(a === 'clearPair'){ handleClearPair(el); }
  else if(a === 'pickWinner'){ handlePickWinner(el); }
  else if(a === 'clearWinner'){ handleClearWinner(el); }
  else if(a === 'generateBracket'){ handleGenerateBracket(el); }
  else if(a === 'deleteBracket'){ handleDeleteBracket(el); }
  else if(a === 'bracketSave'){ handleBracketSave(el); }
  else if(a === 'bracketClear'){ handleBracketClear(el); }
  else if(a === 'openMembers'){ openMembers(el.dataset.sport, el.dataset.id); }
  else if(a === 'delMember'){ handleDeleteMember(el); }
  else if(a === 'toggleCaptain'){ handleToggleCaptain(el); }
  else if(a === 'delTeam'){
    const sp = getSport(el.dataset.sport); if(!sp) return;
    if(sp.teams.length <= MIN_TEAMS){ toast(t('minTeams')); return; }
    if(!confirm(t('confirmDeleteTeam'))) return;
    const id = el.dataset.id;
    sp.teams = sp.teams.filter(x => x.id !== id);
    sp.matches = sp.matches.filter(m => m.home !== id && m.away !== id);
    delete sp.soloScores[id]; delete sp.ranks[id]; delete sp.teamMembers[id];
    Object.keys(sp.winners||{}).forEach(k => { const w = sp.winners[k]; if(w && (w.a === id || w.b === id)) delete sp.winners[k]; });
    if(sp.bracket){ sp.bracket.forEach(r => { r.matches = r.matches.filter(m => m.a !== id && m.b !== id); r.byes = r.byes.filter(b => b !== id); }); sp.bracket = sp.bracket.filter(r => r.matches.length || r.byes.length); if(!sp.bracket.length) sp.bracket = null; if(sp.champion === id) sp.champion = null; }
    save(); render(); toast(t('deleted'));
  }
  else if(a === 'logout'){ handleLogout(); }
  else if(a === 'toggleSport'){ const sp = getSport(el.dataset.id); if(!sp) return; sp.active = !sp.active; DEBUG.ok('ورزش ' + sp.id + (sp.active ? ' فعال شد' : ' غیرفعال شد')); save(); el.classList.toggle('on', sp.active); toast(sp.active ? '✅ ' + t('activated') : '⭕ ' + t('deactivated')); }
  else if(a === 'configureSport'){ openSportConfig(el.dataset.id); }
});

document.addEventListener('input', e => {
  const inp = e.target.closest('[data-rename]');
  if(inp){ const sp = getSport(inp.dataset.sport); if(!sp) return; const tm = sp.teams.find(x => x.id === inp.dataset.rename); if(!tm) return; const v = inp.value.trim(); if(v) tm.name = v; save(); return; }
  const mem = e.target.closest('[data-member-rename]');
  if(mem){ const sp = getSport(mem.dataset.sport); if(!sp) return; const list = sp.teamMembers[mem.dataset.team] || []; const m = list.find(x => x.id === mem.dataset.memberRename); if(!m) return; const v = mem.value.trim(); if(v) m.name = v; save(); return; }
  const sc = e.target.closest('[data-solo-score]');
  if(sc){ const sp = getSport(sc.dataset.sport); if(!sp) return; const id = sc.dataset.soloScore; const v = sc.value.trim(); if(v === ''){ delete sp.soloScores[id]; } else { sp.soloScores[id] = Math.max(0, parseInt(v,10) || 0); } save(); return; }
  const rk = e.target.closest('[data-solo-rank]');
  if(rk){ const sp = getSport(rk.dataset.sport); if(!sp) return; const id = rk.dataset.soloRank; const v = rk.value.trim(); if(v === ''){ delete sp.ranks[id]; } else { sp.ranks[id] = Math.max(1, parseInt(v,10) || 1); } save(); }
});

document.addEventListener('change', e => {
  const inp = e.target.closest('[data-rename]'); if(!inp) return;
  const sp = getSport(inp.dataset.sport); if(!sp) return;
  const tm = sp.teams.find(x => x.id === inp.dataset.rename); if(!tm) return;
  const v = inp.value.trim(); if(!v){ inp.value = tm.name; return; }
  if(sp.teams.some(x => x.id !== tm.id && x.name.trim().toLowerCase() === v.toLowerCase())){ toast(t('teamExists')); inp.value = tm.name; }
});

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.matches('[data-score="hg"],[data-score="ag"]')){ e.preventDefault(); const row = e.target.closest('.rr-row'); row?.querySelector('.rr-btn.save')?.click(); return; }
  if(e.target.matches('[data-bracket="hg"],[data-bracket="ag"]')){ e.preventDefault(); const row = e.target.closest('.bracket-match'); row?.querySelector('.bm-btn.save')?.click(); return; }
});

/* ============ INIT ============ */
(async function init(){
  DEBUG.info('🚀 شروع init');
  await loadServer(currentServerId, true);
  applySettings();
  render();
  setupChannels();
  startPolling();
  if(supabaseClient) showSyncBadge('online');
  DEBUG.ok('✅ اپ آماده شد - سرور: ' + currentServerId);
  console.log('🚀 اپ آماده - سرور: ' + currentServerId);
})();
</script>
</body>
