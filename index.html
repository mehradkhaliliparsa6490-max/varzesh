function openSportConfig(sportId){
  const sp = getSport(sportId); if(!sp) return;
  const isScore = sp.type === 'score';
  const isWinner = sp.type === 'winner';
  const isHead = isScore || isWinner;
  const isKnockout = isHead && sp.mode === 'knockout';
  const useByScore = isScore && sp.scoreMode === 'byScore';
  const isIndividual = sp.sportKind === 'individual';

  const modeToggle = isHead ? `
    <div class="set-row" style="padding:10px 0;border-top:1px solid var(--border);margin-top:8px">
      <div><div class="lbl">⚔️ ${esc(t('mode'))}</div><div class="hint">${esc(t('modeHint'))}</div></div>
      <div class="seg">
        <button type="button" data-action="setMode" data-val="league" class="${!isKnockout?'active':''}">${esc(t('modeLeague'))}</button>
        <button type="button" data-action="setMode" data-val="knockout" class="${isKnockout?'active':''}">${esc(t('modeKnockout'))}</button>
      </div>
    </div>
    <input type="hidden" name="mode" value="${sp.mode || 'league'}">
  ` : '';

  const scoreModeToggle = isScore ? `
    <div class="set-row" style="padding:10px 0;border-top:1px solid var(--border);margin-top:8px">
      <div><div class="lbl">🎯 ${esc(t('scoringMode'))}</div><div class="hint">${esc(t('scoringByScoreHint'))}</div></div>
      <div class="seg">
        <button type="button" data-action="setScoreMode" data-val="simple"  class="${!useByScore?'active':''}">${esc(t('scoringSimple'))}</button>
        <button type="button" data-action="setScoreMode" data-val="byScore" class="${useByScore?'active':''}">${esc(t('scoringByScore'))}</button>
      </div>
    </div>
    <input type="hidden" name="scoreMode" value="${sp.scoreMode || 'simple'}">
  ` : '';

  const simpleBlock = isScore ? `
    <div id="simplePointsBlock" style="display:${!useByScore?'grid':'none'};grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="field"><label>${esc(t('winPoints'))}</label><input class="input" type="number" name="winPoints" min="0" max="10" step="0.5" value="${sp.winPoints}"></div>
      <div class="field"><label>${esc(t('drawPoints'))}</label><input class="input" type="number" name="drawPoints" min="0" max="10" step="0.5" value="${sp.drawPoints}"></div>
    </div>
  ` : '';

  const byScoreBlock = isScore ? `
    <div id="byScoreBlock" style="display:${useByScore?'block':'none'};margin-bottom:12px">
      <div class="field" style="margin-bottom:10px">
        <label>${esc(t('loserThreshold'))}</label>
        <input class="input" type="number" name="loserThreshold" min="0" max="99" value="${sp.loserThreshold ?? 0}" style="text-align:center">
        <div style="font-size:.68rem;color:var(--muted);margin-top:2px">${esc(t('loserThresholdHint'))}</div>
      </div>
      <div class="rule-card">
        <div class="rule-card-title">✅ ${esc(t('cleanWin'))} <span style="color:var(--muted);font-weight:600">— ${esc(t('cleanWinExample'))}</span></div>
        <div class="rule-card-grid">
          <div class="field"><label>${esc(t('winnerPoints'))}</label><input class="input" type="number" name="cleanWinWinner" min="0" max="10" step="0.5" value="${sp.cleanWin?.winner ?? 3}"></div>
          <div class="field"><label>${esc(t('loserPoints'))}</label><input class="input" type="number" name="cleanWinLoser" min="0" max="10" step="0.5" value="${sp.cleanWin?.loser ?? 0}"></div>
        </div>
      </div>
      <div class="rule-card">
        <div class="rule-card-title">🔥 ${esc(t('closeWin'))} <span style="color:var(--muted);font-weight:600">— ${esc(t('closeWinExample'))}</span></div>
        <div class="rule-card-grid">
          <div class="field"><label>${esc(t('winnerPoints'))}</label><input class="input" type="number" name="closeWinWinner" min="0" max="10" step="0.5" value="${sp.closeWin?.winner ?? 2}"></div>
          <div class="field"><label>${esc(t('loserPoints'))}</label><input class="input" type="number" name="closeWinLoser" min="0" max="10" step="0.5" value="${sp.closeWin?.loser ?? 1}"></div>
        </div>
      </div>
    </div>
  ` : '';

  const winnerPointsBlock = isWinner ? `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="field"><label>${esc(t('winPoints'))}</label><input class="input" type="number" name="winPoints" min="0" max="10" step="0.5" value="${sp.winPoints}"></div>
      <div class="field"><label>${esc(t('drawPoints'))}</label><input class="input" type="number" name="drawPoints" min="0" max="10" step="0.5" value="${sp.drawPoints}"></div>
    </div>
  ` : '';

  const drawToggle = isHead && !isKnockout ? `
    <div class="set-row" style="padding:10px 0"><div class="lbl">${esc(t('allowDraw'))}</div>
      <div class="seg">
        <button type="button" data-action="setAllowDraw" data-val="1" class="${sp.allowDraw?'active':''}">${esc(t('yes'))}</button>
        <button type="button" data-action="setAllowDraw" data-val="0" class="${!sp.allowDraw?'active':''}">${esc(t('no'))}</button>
      </div>
    </div>
    <input type="hidden" name="allowDraw" value="${sp.allowDraw?'1':'0'}">
  ` : '';

  /* Sport kind segmented (always shown) */
  const sportKindBlock = `
    <div class="set-row" style="padding:10px 0;border-top:1px solid var(--border);margin-top:8px">
      <div><div class="lbl">${isIndividual ? '👤' : '👥'} ${esc(t('sportKind'))}</div><div class="hint">${esc(t('sportKindHint'))}</div></div>
      <div class="seg">
        <button type="button" data-action="setSportKind" data-val="team" class="${!isIndividual?'active':''}">${esc(t('kindTeam'))}</button>
        <button type="button" data-action="setSportKind" data-val="individual" class="${isIndividual?'active':''}">${esc(t('kindIndividual'))}</button>
      </div>
    </div>
    <input type="hidden" name="sportKind" value="${sp.sportKind || 'team'}">
  `;

  /* Show members toggle (always shown) */
  const showMembersBlock = `
    <div class="set-row" style="padding:10px 0;border-top:1px solid var(--border);margin-top:8px">
      <div><div class="lbl">👥 ${esc(t('showMembers'))}</div><div class="hint">${esc(t('showMembersHint'))}</div></div>
      <button type="button" class="toggle ${sp.showMembers?'on':''}" data-action="toggleShowMembers" data-val="${sp.showMembers?'1':'0'}"></button>
    </div>
    <input type="hidden" name="showMembers" value="${sp.showMembers?'1':'0'}">

    <div class="set-row" id="showCaptainRow" style="padding:10px 0;display:${sp.showMembers?'':'none'}">
      <div><div class="lbl">⭐ ${esc(t('showCaptain'))}</div><div class="hint">${esc(t('showCaptainHint'))}</div></div>
      <button type="button" class="toggle ${sp.showCaptain?'on':''}" data-action="toggleShowCaptain" data-val="${sp.showCaptain?'1':'0'}"></button>
    </div>
    <input type="hidden" name="showCaptain" value="${sp.showCaptain?'1':'0'}">
  `;

  openModal(`
    <div class="modal-head"><h2>⚙️ ${esc(t('sportSettings'))}</h2><button class="icon-btn sm" data-action="closeModal">✕</button></div>
    <p class="modal-sub">${esc(sp.icon)} <b>${esc(sp.name)}</b> — <span class="sport-type-badge">${TYPE_INFO[sp.type].icon} ${esc(TYPE_INFO[sp.type].label)}</span></p>
    <form id="sportCfgForm" data-sport="${sportId}">
      <div class="field" style="margin-bottom:12px"><label>${esc(t('sportName'))}</label><input class="input" type="text" name="name" maxlength="30" value="${esc(sp.name)}"></div>
      <div class="field" style="margin-bottom:12px"><label>${esc(t('sportIcon'))}</label><input class="input" type="text" name="icon" maxlength="4" value="${esc(sp.icon)}" style="text-align:center;font-size:1.3rem"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div class="field"><label>${esc(t('unit'))}</label><input class="input" type="text" name="unit" maxlength="15" value="${esc(sp.unit)}"></div>
        <div class="field"><label>${esc(t('unitPlural'))}</label><input class="input" type="text" name="unitPlural" maxlength="20" value="${esc(sp.unitPlural)}"></div>
      </div>
      ${sportKindBlock}
      ${showMembersBlock}
      ${modeToggle}
      ${scoreModeToggle}
      ${simpleBlock}
      ${byScoreBlock}
      ${winnerPointsBlock}
      ${drawToggle}
      <button class="btn primary block" type="submit" style="margin-top:14px">💾 ${esc(t('save'))}</button>
      <button class="btn block" type="button" data-action="closeModal" style="margin-top:9px">${esc(t('cancel'))}</button>
    </form>
  `);

  /* Sport kind toggle */
  modalEl.querySelectorAll('[data-action="setSportKind"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val;
      modalEl.querySelector('input[name="sportKind"]').value = val;
      modalEl.querySelectorAll('[data-action="setSportKind"]').forEach(b => b.classList.toggle('active', b.dataset.val === val));
    });
  });

  /* Show members toggle */
  modalEl.querySelectorAll('[data-action="toggleShowMembers"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const current = modalEl.querySelector('input[name="showMembers"]').value === '1';
      const newVal = !current;
      btn.dataset.val = newVal ? '1' : '0';
      btn.classList.toggle('on', newVal);
      modalEl.querySelector('input[name="showMembers"]').value = newVal ? '1' : '0';
      const capRow = modalEl.querySelector('#showCaptainRow');
      if(capRow) capRow.style.display = newVal ? '' : 'none';
      // If turning off showMembers, also turn off showCaptain
      if(!newVal){
        const capBtn = modalEl.querySelector('[data-action="toggleShowCaptain"]');
        if(capBtn){ capBtn.classList.remove('on'); capBtn.dataset.val = '0'; }
        const capInput = modalEl.querySelector('input[name="showCaptain"]');
        if(capInput) capInput.value = '0';
      }
    });
  });

  /* Show captain toggle */
  modalEl.querySelectorAll('[data-action="toggleShowCaptain"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const current = modalEl.querySelector('input[name="showCaptain"]').value === '1';
      const newVal = !current;
      btn.dataset.val = newVal ? '1' : '0';
      btn.classList.toggle('on', newVal);
      modalEl.querySelector('input[name="showCaptain"]').value = newVal ? '1' : '0';
    });
  });

  /* Mode toggle */
  modalEl.querySelectorAll('[data-action="setMode"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val;
      modalEl.querySelector('input[name="mode"]').value = val;
      modalEl.querySelectorAll('[data-action="setMode"]').forEach(b => b.classList.toggle('active', b.dataset.val === val));
      const showPoints = val === 'league';
      const scoreModeRow = modalEl.querySelector('[data-action="setScoreMode"]')?.closest('.set-row');
      if(scoreModeRow) scoreModeRow.style.display = showPoints ? '' : 'none';
      const simple = modalEl.querySelector('#simplePointsBlock');
      const byScore = modalEl.querySelector('#byScoreBlock');
      const useBy = modalEl.querySelector('input[name="scoreMode"]')?.value === 'byScore';
      if(simple) simple.style.display = (showPoints && !useBy) ? 'grid' : 'none';
      if(byScore) byScore.style.display = (showPoints && useBy) ? 'block' : 'none';
      const wp = modalEl.querySelectorAll('input[name="winPoints"],input[name="drawPoints"]');
      wp.forEach(inp => {
        const isScoreType = !!modalEl.querySelector('input[name="scoreMode"]');
        if(!isScoreType){ inp.closest('.field').style.display = showPoints ? '' : 'none'; }
      });
      const drawRow = modalEl.querySelector('[data-action="setAllowDraw"]')?.closest('.set-row');
      if(drawRow) drawRow.style.display = showPoints ? '' : 'none';
    });
  });

  /* Score mode toggle */
  modalEl.querySelectorAll('[data-action="setScoreMode"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val;
      modalEl.querySelector('input[name="scoreMode"]').value = val;
      modalEl.querySelectorAll('[data-action="setScoreMode"]').forEach(b => b.classList.toggle('active', b.dataset.val === val));
      const simple = modalEl.querySelector('#simplePointsBlock');
      const byScore = modalEl.querySelector('#byScoreBlock');
      if(simple) simple.style.display = val === 'simple' ? 'grid' : 'none';
      if(byScore) byScore.style.display = val === 'byScore' ? 'block' : 'none';
    });
  });

  /* allowDraw toggle */
  modalEl.querySelectorAll('[data-action="setAllowDraw"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val === '1';
      modalEl.querySelector('input[name="allowDraw"]').value = val ? '1' : '0';
      modalEl.querySelectorAll('[data-action="setAllowDraw"]').forEach(b => { b.classList.toggle('active', b.dataset.val === (val ? '1' : '0')); });
    });
  });

  /* Submit */
  document.getElementById('sportCfgForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    sp.name = String(fd.get('name') || '').trim() || sp.name;
    sp.icon = String(fd.get('icon') || '').trim() || sp.icon;
    sp.unit = String(fd.get('unit') || '').trim() || sp.unit;
    sp.unitPlural = String(fd.get('unitPlural') || '').trim() || sp.unitPlural;
    sp.sportKind = fd.get('sportKind') === 'individual' ? 'individual' : 'team';
    sp.showMembers = fd.get('showMembers') === '1';
    sp.showCaptain = sp.showMembers && fd.get('showCaptain') === '1';
    if(isHead){
      const newMode = fd.get('mode') === 'knockout' ? 'knockout' : 'league';
      sp.mode = newMode;
      if(newMode === 'league'){
        if(isScore){
          sp.scoreMode = fd.get('scoreMode') === 'byScore' ? 'byScore' : 'simple';
          sp.winPoints = Math.max(0, parseFloat(fd.get('winPoints')) || 0);
          sp.drawPoints = Math.max(0, parseFloat(fd.get('drawPoints')) || 0);
          sp.loserThreshold = Math.max(0, parseInt(fd.get('loserThreshold'), 10) || 0);
          sp.cleanWin = { winner: Math.max(0, parseFloat(fd.get('cleanWinWinner')) || 0), loser: Math.max(0, parseFloat(fd.get('cleanWinLoser')) || 0) };
          sp.closeWin = { winner: Math.max(0, parseFloat(fd.get('closeWinWinner')) || 0), loser: Math.max(0, parseFloat(fd.get('closeWinLoser')) || 0) };
        }
        if(isWinner){
          sp.winPoints = Math.max(0, parseFloat(fd.get('winPoints')) || 0);
          sp.drawPoints = Math.max(0, parseFloat(fd.get('drawPoints')) || 0);
        }
        sp.allowDraw = fd.get('allowDraw') === '1';
      }
    }
    save(); closeModal(); render();
    toast('✅ ' + t('sportUpdated'));
  });
}

/* ============ HANDLERS ============ */
function handleSavePair(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  const row = btn.closest('.rr-row');
  const hgI = row.querySelector('[data-score="hg"]'), agI = row.querySelector('[data-score="ag"]');
  const hgS = hgI.value.trim(), agS = agI.value.trim();
  if(hgS === '' || agS === ''){ toast(t('fillScores')); (hgS === '' ? hgI : agI).focus(); return; }
  const hg = Math.max(0, Math.min(sp.maxScore || 99, parseInt(hgS,10)||0));
  const ag = Math.max(0, Math.min(sp.maxScore || 99, parseInt(agS,10)||0));
  const aId = btn.dataset.a, bId = btn.dataset.b;
  const ex = sp.matches.find(m => (m.home===aId && m.away===bId) || (m.home===bId && m.away===aId));
  let matchId;
  if(ex){ if(ex.home===aId){ ex.hg=hg; ex.ag=ag; } else { ex.hg=ag; ex.ag=hg; } matchId = ex.id; }
  else{ const nm = { id: uid(), home: aId, away: bId, hg, ag }; sp.matches.push(nm); matchId = nm.id; }
  save(); row.classList.add('played');
  const actions = row.querySelector('.rr-actions');
  if(!actions.querySelector('.clear')){ const cb = document.createElement('button'); cb.className = 'rr-btn clear'; cb.dataset.action = 'clearPair'; cb.dataset.sport = sp.id; cb.dataset.id = matchId; cb.textContent = '✕'; actions.appendChild(cb); }
  try{ row.animate([{background:'rgba(74,222,128,.28)'},{background:'transparent'}], {duration:600}); }catch(e){}
  toast(t('saved'));
}

function handleClearPair(btn){
  if(!confirm(t('confirmDeleteMatch'))) return;
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  const row = btn.closest('.rr-row');
  sp.matches = sp.matches.filter(m => m.id !== btn.dataset.id);
  save(); row.classList.remove('played');
  row.querySelector('[data-score="hg"]').value = ''; row.querySelector('[data-score="ag"]').value = '';
  btn.remove(); toast(t('deleted'));
}

function handlePickWinner(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  const aId = btn.dataset.a, bId = btn.dataset.b, w = btn.dataset.w;
  const key = aId + '|' + bId;
  sp.winners[key] = { a: aId, b: bId, winner: w };
  save(); render(); toast(t('saved'));
}

function handleClearWinner(btn){
  if(!confirm(t('confirmDeleteMatch'))) return;
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  delete sp.winners[btn.dataset.key];
  save(); render(); toast(t('deleted'));
}

function handleGenerateBracket(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  if(sp.teams.length < MIN_TEAMS){ toast(t('needTwoTeams')); return; }
  if(sp.bracket && sp.bracket.length){ if(!confirm(t('confirmRegenerate'))) return; }
  const ok = generateBracket(sp);
  if(ok){ save(); render(); toast('🏆 ' + t('bracketGenerated')); }
}

function handleDeleteBracket(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  if(!confirm(t('confirmDeleteBracket'))) return;
  sp.bracket = null; sp.champion = null;
  save(); render(); toast('🗑️ ' + t('bracketDeleted'));
}

function handleBracketSave(btn){
  const sp = getSport(btn.dataset.sport); if(!sp || !sp.bracket) return;
  const roundIdx = parseInt(btn.dataset.round, 10);
  const matchId = btn.dataset.match;
  const round = sp.bracket[roundIdx]; if(!round) return;
  const match = round.matches.find(m => m.id === matchId); if(!match) return;
  const row = btn.closest('.bracket-match');
  const hgI = row.querySelector('[data-bracket="hg"]');
  const agI = row.querySelector('[data-bracket="ag"]');
  const hgS = hgI.value.trim(), agS = agI.value.trim();
  if(hgS === '' || agS === ''){ toast(t('fillScores')); (hgS === '' ? hgI : agI).focus(); return; }
  const hg = Math.max(0, Math.min(99, parseInt(hgS,10)||0));
  const ag = Math.max(0, Math.min(99, parseInt(agS,10)||0));
  if(hg === ag){ toast(t('knockoutNoDraw')); return; }
  match.hg = hg; match.ag = ag; match.winner = hg > ag ? 'a' : 'b';
  ensureBracketRounds(sp);
  save(); render(); toast(t('saved'));
}

function handleBracketClear(btn){
  if(!confirm(t('confirmResetMatch'))) return;
  const sp = getSport(btn.dataset.sport); if(!sp || !sp.bracket) return;
  const roundIdx = parseInt(btn.dataset.round, 10);
  const matchId = btn.dataset.match;
  const round = sp.bracket[roundIdx]; if(!round) return;
  const match = round.matches.find(m => m.id === matchId); if(!match) return;
  match.hg = null; match.ag = null; match.winner = null;
  sp.bracket = sp.bracket.slice(0, roundIdx + 1);
  sp.champion = null;
  save(); render(); toast(t('deleted'));
}

function handleDeleteMember(btn){
  if(!confirm(t('confirmDeleteMember'))) return;
  const sportId = btn.dataset.sport, teamId = btn.dataset.team, memberId = btn.dataset.member;
  const sp = getSport(sportId); if(!sp) return;
  const list = sp.teamMembers[teamId] || [];
  sp.teamMembers[teamId] = list.filter(m => m.id !== memberId);
  save();
  openMembers(sportId, teamId);
  toast(t('memberDeleted'));
}

function handleToggleCaptain(btn){
  const sportId = btn.dataset.sport, teamId = btn.dataset.team, memberId = btn.dataset.member;
  const sp = getSport(sportId); if(!sp) return;
  const list = sp.teamMembers[teamId] || [];
  const target = list.find(m => m.id === memberId); if(!target) return;
  // Toggle: if it's already captain, remove; else set as captain (unset others)
  if(target.isCaptain){
    target.isCaptain = false;
  }else{
    list.forEach(m => m.isCaptain = false);
    target.isCaptain = true;
  }
  save();
  openMembers(sportId, teamId);
  toast(t('captainSet'));
}

function handleLogout(){
  if(!confirm(t('confirmLogout'))) return;
  authed = false; currentView = 'sports'; currentSportId = null; currentTab = 'table';
  applySettings(); render(); window.scrollTo({top:0,behavior:'smooth'});
  toast('🚪 ' + t('loggedOut'));
}

function handleDeleteAll(){
  if(!confirm(t('confirmDeleteAll'))) return;
  if(!confirm(t('confirmDeleteAll2'))) return;
  try{
    localStorage.removeItem(STORAGE_KEY);
    OLD_KEYS.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });
  }catch(e){}
  state = defaultState();
  authed = false; currentView = 'sports'; currentSportId = null; currentTab = 'table';
  save(); closeModal(); applySettings(); render();
  window.scrollTo({top:0,behavior:'smooth'});
  toast('🗑️ ' + t('allDataDeleted'));
}

/* ============ EVENT DELEGATION ============ */
document.addEventListener('mousedown', e => {
  if(e.target.closest('[data-action="openPalette"],[data-action="setColor"]')) e.preventDefault();
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action;

  if(a === 'goHome'){ currentView = 'sports'; currentSportId = null; currentTab = 'table'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a === 'openSport'){ currentSportId = el.dataset.id; currentView = 'sport'; currentTab = 'table'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a === 'sportTab'){ currentTab = el.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a === 'gotoAdmin'){ currentView = 'admin'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a === 'adminShortcut'){ if(authed){ currentView = 'admin'; render(); window.scrollTo({top:0,behavior:'smooth'}); } else openPassword(); }
  else if(a === 'openSettings'){ openSettings(); }
  else if(a === 'openGuide'){ openGuide(); }
  else if(a === 'closeModal'){ closeModal(); }
  else if(a === 'askPassword'){ openPassword(); }
  else if(a === 'setTheme'){ state.settings.theme = el.dataset.val; save(); applySettings(); openSettings(); }
  else if(a === 'setLang'){ state.settings.lang = el.dataset.val; save(); render(); openSettings(); }
  else if(a === 'deleteAllData'){ handleDeleteAll(); }
  else if(a === 'openPalette'){ openPalette(el.dataset.sport, el.dataset.id); }
  else if(a === 'setColor'){ const sp = getSport(el.dataset.sport); if(!sp) return; const team = sp.teams.find(x => x.id === el.dataset.id); if(!team) return; team.color = el.dataset.color; save(); closeModal(); render(); toast(t('saved')); }
  else if(a === 'savePair'){ handleSavePair(el); }
  else if(a === 'clearPair'){ handleClearPair(el); }
  else if(a === 'pickWinner'){ handlePickWinner(el); }
  else if(a === 'clearWinner'){ handleClearWinner(el); }
  else if(a === 'generateBracket'){ handleGenerateBracket(el); }
  else if(a === 'deleteBracket'){ handleDeleteBracket(el); }
  else if(a === 'bracketSave'){ handleBracketSave(el); }
  else if(a === 'bracketClear'){ handleBracketClear(el); }
  else if(a === 'openMembers'){ openMembers(el.dataset.sport, el.dataset.id); }
  else if(a === 'delMember'){ handleDeleteMember(el); }
  else if(a === 'toggleCaptain'){ handleToggleCaptain(el); }
  else if(a === 'delTeam'){
    const sp = getSport(el.dataset.sport); if(!sp) return;
    if(sp.teams.length <= MIN_TEAMS){ toast(t('minTeams')); return; }
    if(!confirm(t('confirmDeleteTeam'))) return;
    const id = el.dataset.id;
    sp.teams = sp.teams.filter(x => x.id !== id);
    sp.matches = sp.matches.filter(m => m.home !== id && m.away !== id);
    delete sp.soloScores[id]; delete sp.ranks[id];
    delete sp.teamMembers[id];
    Object.keys(sp.winners||{}).forEach(k => { const w = sp.winners[k]; if(w && (w.a === id || w.b === id)) delete sp.winners[k]; });
    if(sp.bracket){
      sp.bracket.forEach(r => { r.matches = r.matches.filter(m => m.a !== id && m.b !== id); r.byes = r.byes.filter(b => b !== id); });
      sp.bracket = sp.bracket.filter(r => r.matches.length || r.byes.length);
      if(!sp.bracket.length) sp.bracket = null;
      if(sp.champion === id) sp.champion = null;
    }
    save(); render(); toast(t('deleted'));
  }
  else if(a === 'logout'){ handleLogout(); }
  else if(a === 'toggleSport'){ const sp = getSport(el.dataset.id); if(!sp) return; sp.active = !sp.active; save(); el.classList.toggle('on', sp.active); toast(sp.active ? '✅ ' + t('activated') : '⭕ ' + t('deactivated')); }
  else if(a === 'configureSport'){ openSportConfig(el.dataset.id); }
});

document.addEventListener('input', e => {
  const inp = e.target.closest('[data-rename]');
  if(inp){ const sp = getSport(inp.dataset.sport); if(!sp) return; const tm = sp.teams.find(x => x.id === inp.dataset.rename); if(!tm) return; const v = inp.value.trim(); if(v) tm.name = v; save(); return; }
  const mem = e.target.closest('[data-member-rename]');
  if(mem){ const sp = getSport(mem.dataset.sport); if(!sp) return; const tid = mem.dataset.team; const mid = mem.dataset.memberRename; const list = sp.teamMembers[tid] || []; const m = list.find(x => x.id === mid); if(!m) return; const v = mem.value.trim(); if(v) m.name = v; save(); return; }
  const sc = e.target.closest('[data-solo-score]');
  if(sc){ const sp = getSport(sc.dataset.sport); if(!sp) return; const id = sc.dataset.soloScore; const v = sc.value.trim(); if(v === ''){ delete sp.soloScores[id]; } else { sp.soloScores[id] = Math.max(0, parseInt(v,10) || 0); } save(); return; }
  const rk = e.target.closest('[data-solo-rank]');
  if(rk){ const sp = getSport(rk.dataset.sport); if(!sp) return; const id = rk.dataset.soloRank; const v = rk.value.trim(); if(v === ''){ delete sp.ranks[id]; } else { sp.ranks[id] = Math.max(1, parseInt(v,10) || 1); } save(); }
});

document.addEventListener('change', e => {
  const inp = e.target.closest('[data-rename]'); if(!inp) return;
  const sp = getSport(inp.dataset.sport); if(!sp) return;
  const tm = sp.teams.find(x => x.id === inp.dataset.rename); if(!tm) return;
  const v = inp.value.trim(); if(!v){ inp.value = tm.name; return; }
  if(sp.teams.some(x => x.id !== tm.id && x.name.trim().toLowerCase() === v.toLowerCase())){ toast(t('teamExists')); inp.value = tm.name; }
});

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.matches('[data-score="hg"],[data-score="ag"]')){ e.preventDefault(); const row = e.target.closest('.rr-row'); row?.querySelector('.rr-btn.save')?.click(); return; }
  if(e.target.matches('[data-bracket="hg"],[data-bracket="ag"]')){ e.preventDefault(); const row = e.target.closest('.bracket-match'); row?.querySelector('.bm-btn.save')?.click(); return; }
});

(function init(){ applySettings(); render(); if(!localStorage.getItem(STORAGE_KEY)) save(); })();
</script>
</body>
</html>
