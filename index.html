<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark light">
<title>لیگ ورزش‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#070b14; --bg-2:#0d1526;
  --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.10);
  --text:#e9eefb; --muted:#8ea0bf;
  --accent:#4ade80; --accent-2:#22d3ee; --danger:#f87171;
  --panel:#101827; --panel-2:#0c1322;
  --modal-bg:linear-gradient(165deg,#131c30,#0b1220);
  --shadow:0 22px 55px rgba(0,0,0,.5);
  --ring:rgba(74,222,128,.18);
}
html[data-theme="light"]{
  --bg-1:#eef2f9; --bg-2:#dde5f3;
  --surface:rgba(255,255,255,.72); --surface-2:rgba(255,255,255,.95);
  --border:rgba(15,23,42,.10); --text:#0f172a; --muted:#5c6b88;
  --accent:#16a34a; --accent-2:#0891b2; --danger:#dc2626;
  --panel:#ffffff; --panel-2:#f4f7fc;
  --modal-bg:linear-gradient(165deg,#ffffff,#f2f6fd);
  --shadow:0 18px 45px rgba(15,23,42,.14); --ring:rgba(22,163,74,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Vazirmatn',ui-sans-serif,system-ui,-apple-system,sans-serif;
  color:var(--text); background-color:var(--bg-1);
  background-image:
    radial-gradient(1000px 620px at 12% -12%, rgba(74,222,128,.16), transparent 60%),
    radial-gradient(900px 520px at 92% -5%, rgba(34,211,238,.14), transparent 58%),
    linear-gradient(160deg,var(--bg-1),var(--bg-2));
  background-attachment:fixed; min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
html[data-theme="light"] body{
  background-image:
    radial-gradient(1000px 620px at 12% -12%, rgba(34,197,94,.14), transparent 60%),
    radial-gradient(900px 520px at 92% -5%, rgba(6,182,212,.14), transparent 58%),
    linear-gradient(160deg,var(--bg-1),var(--bg-2));
}
button,input,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:20px}
.app{max-width:1020px;margin:0 auto;padding:14px 14px calc(60px + env(safe-area-inset-bottom))}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-radius:20px;background:var(--surface);
  border:1px solid var(--border);backdrop-filter:blur(20px);
  box-shadow:var(--shadow);position:sticky;top:8px;z-index:60;isolation:isolate;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer;flex:1}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#4ade80,#22d3ee);box-shadow:0 10px 24px rgba(34,211,238,.3)}
.brand-text{min-width:0}
.brand-text h1{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text p{font-size:.7rem;color:var(--muted);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:6px;flex:0 0 auto}
.icon-btn{width:42px;height:42px;border-radius:13px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface-2);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.sm{width:36px;height:36px;font-size:15px;border-radius:11px}
.icon-btn.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(74,222,128,.2),rgba(34,211,238,.16))}
#logoutTopBtn{display:none}
#logoutTopBtn.show{display:grid;color:var(--danger)}

.tabs{display:flex;gap:5px;margin:14px 0;padding:5px;border-radius:16px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(16px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:88px;padding:11px 10px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:.84rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:.22s}
.tab.active{background:linear-gradient(135deg,rgba(74,222,128,.2),rgba(34,211,238,.16));color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.tab:active{transform:scale(.97)}

.section{margin-bottom:18px}
.section-title{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.03em;margin:0 4px 10px;display:flex;align-items:center;gap:7px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;backdrop-filter:blur(18px);box-shadow:var(--shadow);position:relative;z-index:1;overflow:hidden}
.hint-box{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(74,222,128,.06));border:1px solid rgba(34,211,238,.2);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:.82rem;line-height:1.7;color:var(--text)}
.hint-box b{color:var(--accent-2)}

.sports-hero{text-align:center;padding:22px 12px 20px}
.sports-hero h2{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sports-hero p{font-size:.84rem;color:var(--muted);font-weight:500}
.sports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.sport-card{position:relative;padding:20px 14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:22px;cursor:pointer;transition:.28s cubic-bezier(.2,.9,.3,1);text-align:center;overflow:hidden;backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.sport-card::before{content:'';position:absolute;inset:0;background:radial-gradient(300px 200px at 50% 0%, var(--sport-color, var(--accent)), transparent 70%);opacity:.14;transition:.3s;pointer-events:none}
.sport-card:hover{transform:translateY(-4px);border-color:var(--sport-color, var(--accent))}
.sport-card:hover::before{opacity:.24}
.sport-card:active{transform:translateY(-1px) scale(.98)}
.sport-icon{font-size:42px;display:block;margin-bottom:10px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));position:relative}
.sport-name{font-size:1rem;font-weight:800;margin-bottom:8px;position:relative;line-height:1.3}
.sport-type-badge{display:inline-block;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--surface-2);color:var(--muted);position:relative;margin-top:2px}
.sport-meta{font-size:.72rem;color:var(--muted);font-weight:600;display:flex;justify-content:center;gap:10px;position:relative;margin-top:8px;flex-wrap:wrap}

.sport-header{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:14px;backdrop-filter:blur(16px);box-shadow:var(--shadow);position:relative;overflow:hidden;z-index:1}
.sport-header::before{content:'';position:absolute;inset:0;background:radial-gradient(500px 200px at 0% 50%, var(--sport-color, var(--accent)), transparent 70%);opacity:.13;pointer-events:none}
.back-btn{width:42px;height:42px;border-radius:13px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface-2);font-size:18px;cursor:pointer;display:grid;place-items:center;transition:.2s;position:relative}
.back-btn:hover{border-color:var(--accent);transform:scale(1.05)}
.sport-header-icon{font-size:34px;flex:0 0 auto;position:relative}
.sport-header-info{min-width:0;flex:1;position:relative}
.sport-header-info h2{font-size:1.08rem;font-weight:800;line-height:1.3}
.sport-header-info p{font-size:.72rem;color:var(--muted);margin-top:3px;font-weight:600}

.table-wrap{border-radius:20px;border:1px solid var(--border);background:var(--panel);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow);position:relative;z-index:1}
table{width:100%;border-collapse:collapse;min-width:440px}
thead th{background:var(--panel-2);font-size:.72rem;font-weight:700;color:var(--muted);padding:13px 8px;text-align:center;white-space:nowrap}
thead th:first-child{width:56px}
thead th:nth-child(2){text-align:start;padding-inline-start:14px}
tbody td{padding:13px 8px;text-align:center;white-space:nowrap;font-size:.88rem;font-weight:600;border-top:1px solid var(--border);background:var(--panel)}
tbody td:first-child{width:56px}
tbody td:nth-child(2){text-align:start;padding-inline-start:14px;font-weight:700}
tbody tr:first-child td{border-top:0}
.rank-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:10px;font-size:.78rem;font-weight:800;background:var(--surface-2);color:var(--muted)}
.team-cell{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;box-shadow:0 0 0 2px rgba(255,255,255,.06)}
.pts{color:var(--accent);font-weight:800}
.big-score{font-size:1.05rem;font-weight:800;color:var(--accent-2)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:20px}
.empty .ico{font-size:42px;display:block;margin-bottom:12px;opacity:.7}
.empty p{font-size:.86rem;font-weight:500;line-height:1.7}

.match-list{display:flex;flex-direction:column;gap:9px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:13px;transition:.2s;position:relative;z-index:1}
.match:hover{border-color:var(--accent)}
.m-team{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.m-team.a{justify-content:flex-start}
.m-team.b{justify-content:flex-end}
.m-score{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.95rem;padding:6px 12px;border-radius:10px;background:var(--surface-2);white-space:nowrap}
.m-score .win{color:var(--accent)}
.m-winner-badge{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:8px;background:linear-gradient(135deg,rgba(74,222,128,.25),rgba(34,211,238,.2));color:var(--text);white-space:nowrap}
.score-preview{display:flex;align-items:center;gap:4px;font-size:.65rem;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(34,211,238,.12);color:var(--accent-2);white-space:nowrap;border:1px solid rgba(34,211,238,.22)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.74rem;font-weight:700;color:var(--muted)}
.input{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);font-size:.92rem;font-weight:500;outline:none;transition:.2s;min-width:0}
html[data-theme="light"] .input{background:#fff}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield;text-align:center;font-weight:700}
.row-form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}

.btn{border:1px solid var(--border);border-radius:13px;padding:12px 18px;font-size:.88rem;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap;background:var(--surface-2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;z-index:1}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;border-color:transparent;box-shadow:0 8px 22px rgba(34,211,238,.28)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.danger{color:var(--danger);border-color:rgba(248,113,113,.3)}
.btn.danger:hover{background:rgba(248,113,113,.12);border-color:var(--danger)}
.btn.danger:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.danger-solid{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(239,68,68,.28)}
.btn.danger-solid:hover{transform:translateY(-2px)}
.btn.block{width:100%}
.btn.sm{padding:9px 12px;font-size:.8rem;border-radius:11px;min-width:38px}

.team-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--border)}
.team-row:first-child{border-top:0}
.team-row .input{padding:10px 12px;font-size:.86rem}
.color-pick-btn{width:42px;height:42px;border-radius:12px;flex:0 0 auto;border:2px solid var(--border);cursor:pointer;position:relative;transition:.2s;padding:0;overflow:hidden}
.color-pick-btn:hover{border-color:var(--text);transform:scale(1.05)}
.color-pick-btn::after{content:'🎨';position:absolute;inset:0;display:grid;place-items:center;font-size:15px;opacity:0;transition:.2s;background:rgba(0,0,0,.35)}
.color-pick-btn:hover::after{opacity:1}
.member-btn{width:42px;height:42px;border-radius:12px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface-2);font-size:16px;cursor:pointer;display:grid;place-items:center;transition:.2s;position:relative}
.member-btn:hover{border-color:var(--accent-2);transform:scale(1.05)}
.member-btn .badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;font-size:.62rem;font-weight:800;display:grid;place-items:center}

.rr-list{display:flex;flex-direction:column}
.rr-row{display:grid;grid-template-columns:minmax(0,1fr) 44px 12px 44px minmax(0,1fr) auto;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--border);transition:background .2s}
.rr-row:first-child{border-top:0}
.rr-row.played{background:linear-gradient(90deg,rgba(74,222,128,.09) 0%,transparent 30%,transparent 70%,rgba(74,222,128,.09) 100%);border-radius:12px;padding-inline:8px;margin-inline:-8px}
html[data-theme="light"] .rr-row.played{background:linear-gradient(90deg,rgba(22,163,74,.10) 0%,transparent 30%,transparent 70%,rgba(22,163,74,.10) 100%)}
.rr-team{font-size:.86rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;display:flex;align-items:center;gap:5px}
.rr-team.home{justify-content:flex-end;text-align:end}
.rr-team.away{justify-content:flex-start;text-align:start}
.rr-team .tdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.rr-score{width:44px;height:40px;padding:4px;text-align:center;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:800;font-size:.95rem;outline:none;transition:.18s;font-family:inherit}
html[data-theme="light"] .rr-score{background:#fff}
.rr-score:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.rr-score::placeholder{color:var(--muted);opacity:.5;font-weight:600}
.rr-row.played .rr-score{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}
.rr-vs{text-align:center;font-weight:800;color:var(--muted);font-size:.8rem;user-select:none}
.rr-actions{display:flex;gap:4px;flex:0 0 auto}
.rr-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;cursor:pointer;display:grid;place-items:center;transition:.18s;padding:0}
.rr-btn:active{transform:scale(.9)}
.rr-btn.save{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;border-color:transparent;box-shadow:0 4px 14px rgba(34,211,238,.28)}
.rr-btn.save:hover{transform:scale(1.07)}
.rr-btn.clear{color:var(--danger)}

.wr-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.wr-row:first-child{border-top:0}
.wr-row.played{background:linear-gradient(90deg,rgba(74,222,128,.09) 0%,transparent 30%,transparent 70%,rgba(74,222,128,.09) 100%);border-radius:12px;padding-inline:8px;margin-inline:-8px}
.wr-name{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.wr-name.home{justify-content:flex-end;text-align:end}
.wr-name.away{justify-content:flex-start;text-align:start}
.wr-name .tdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.wr-choice{display:flex;gap:6px;flex-wrap:nowrap}
.wr-chip{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);padding:9px 12px;border-radius:11px;font-size:.78rem;font-weight:700;cursor:pointer;transition:.18s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.wr-chip:active{transform:scale(.95)}
.wr-chip.on{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#062017;border-color:transparent;box-shadow:0 4px 12px rgba(34,211,238,.3)}
.wr-chip.on-draw{background:linear-gradient(135deg,#facc15,#fb923c);color:#3a1d02;border-color:transparent;box-shadow:0 4px 12px rgba(251,146,60,.28)}

.solo-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.solo-row:first-child{border-top:0}
.solo-row .input{padding:10px 12px;font-size:.86rem}
.solo-score-input{width:80px;padding:10px;text-align:center;font-weight:800;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:.95rem;outline:none;transition:.2s}
html[data-theme="light"] .solo-score-input{background:#fff}
.solo-score-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}

.rank-medal{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;font-size:1.1rem;font-weight:800;background:var(--surface-2);color:var(--muted)}
.rank-medal.g1{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#221604}
.rank-medal.g2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#0f172a}
.rank-medal.g3{background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff}

.admin-sport-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:14px 4px;border-top:1px solid var(--border)}
.admin-sport-row:first-child{border-top:0}
.admin-sport-icon{font-size:26px;flex:0 0 auto;width:42px;text-align:center}
.admin-sport-info{min-width:0}
.admin-sport-info h4{font-size:.92rem;font-weight:800;line-height:1.3}
.admin-sport-info p{font-size:.7rem;color:var(--muted);margin-top:3px;font-weight:500}
.toggle{position:relative;width:52px;height:30px;flex:0 0 auto;border-radius:15px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:.25s;padding:0}
.toggle::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.25s cubic-bezier(.2,.9,.3,1)}
.toggle.on{background:linear-gradient(135deg,#4ade80,#22d3ee);border-color:transparent}
.toggle.on::after{inset-inline-start:27px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}

.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:4px;margin-top:4px}
.palette-color{width:100%;aspect-ratio:1;border-radius:14px;border:2px solid transparent;cursor:pointer;transition:.2s;position:relative;padding:0}
.palette-color:hover{transform:scale(1.08);border-color:var(--text)}
.palette-color.active{border-color:var(--text);transform:scale(1.05);box-shadow:0 0 0 3px var(--surface-2),0 6px 18px rgba(0,0,0,.25)}
.palette-color.active::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.4rem;text-shadow:0 2px 6px rgba(0,0,0,.55)}

/* Team members display (public) */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.member-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.member-card-head{display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--border)}
.member-card-head .name{font-size:.9rem;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-card-head .count{font-size:.68rem;color:var(--muted);font-weight:700;background:var(--surface-2);padding:3px 8px;border-radius:8px}
.member-list-public{list-style:none;display:flex;flex-direction:column;gap:6px}

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2) + Date.now());

function makeSport(def){
  const base = {
    id: def.id, name: def.name, icon: def.icon, type: def.type,
    unit: def.unit, unitPlural: def.unitPlural,
    active: !!def.active, teams: [], matches: [],
    winners: {}, soloScores: {}, ranks: {},
    mode: 'league', bracket: null, champion: null,
    sportKind: def.sportKind || 'team',
    showMembers: false, showCaptain: false,
    teamMembers: {}
  };
  if(def.type === 'score'){
    base.winPoints = def.winPoints ?? 3; base.drawPoints = def.drawPoints ?? 1;
    base.lossPoints = 0; base.allowDraw = def.allowDraw ?? true; base.maxScore = 99;
    base.scoreMode = def.scoreMode || 'simple';
    base.cleanWin = def.cleanWin || { winner: 3, loser: 0 };
    base.closeWin = def.closeWin || { winner: 2, loser: 1 };
    base.loserThreshold = def.loserThreshold ?? 0;
  }
  if(def.type === 'winner'){
    base.winPoints = def.winPoints ?? 3; base.drawPoints = def.drawPoints ?? 0;
    base.lossPoints = 0; base.allowDraw = def.allowDraw ?? false;
  }
  return base;
}

function defaultState(){
  const st = { sports:{}, settings:{ theme:'dark', lang:'fa' } };
  SPORT_DEFS.forEach(d => { st.sports[d.id] = makeSport(d); });
  // NOTE: no default football teams anymore
  return st;
}

function validateSport(sp, def){
  if(!sp || typeof sp !== 'object') return makeSport(def);
  sp.id = def.id; sp.type = def.type;
  sp.name = sp.name || def.name; sp.icon = sp.icon || def.icon;
  sp.unit = sp.unit || def.unit; sp.unitPlural = sp.unitPlural || def.unitPlural;
  sp.active = !!sp.active;
  sp.teams = Array.isArray(sp.teams) ? sp.teams : [];
  sp.matches = Array.isArray(sp.matches) ? sp.matches : [];
  sp.winners = (sp.winners && typeof sp.winners === 'object') ? sp.winners : {};
  sp.soloScores = (sp.soloScores && typeof sp.soloScores === 'object') ? sp.soloScores : {};
  sp.ranks = (sp.ranks && typeof sp.ranks === 'object') ? sp.ranks : {};
  sp.mode = sp.mode === 'knockout' ? 'knockout' : 'league';
  sp.bracket = Array.isArray(sp.bracket) ? sp.bracket : null;
  sp.champion = sp.champion || null;
  sp.sportKind = sp.sportKind === 'individual' ? 'individual' : (def.sportKind || 'team');
  sp.showMembers = !!sp.showMembers;
  sp.showCaptain = !!sp.showCaptain;
  sp.teamMembers = (sp.teamMembers && typeof sp.teamMembers === 'object') ? sp.teamMembers : {};
  // validate each team's members list
  Object.keys(sp.teamMembers).forEach(tid => {
    const arr = sp.teamMembers[tid];
    if(!Array.isArray(arr)){ delete sp.teamMembers[tid]; return; }
    sp.teamMembers[tid] = arr.map(m => ({
      id: m.id || uid(),
      name: String(m.name || '').trim().slice(0, 30),
      isCaptain: !!m.isCaptain
    })).filter(m => m.name);
  });
  if(def.type === 'score'){
    sp.winPoints = sp.winPoints ?? def.winPoints; sp.drawPoints = sp.drawPoints ?? def.drawPoints;
    sp.lossPoints = sp.lossPoints ?? 0; sp.allowDraw = sp.allowDraw ?? def.allowDraw;
    sp.maxScore = sp.maxScore ?? 99;
    sp.scoreMode = sp.scoreMode === 'byScore' ? 'byScore' : 'simple';
    sp.cleanWin = (sp.cleanWin && typeof sp.cleanWin === 'object')
      ? { winner: Number(sp.cleanWin.winner) || 0, loser: Number(sp.cleanWin.loser) || 0 }
      : (def.cleanWin || { winner: 3, loser: 0 });
    sp.closeWin = (sp.closeWin && typeof sp.closeWin === 'object')
      ? { winner: Number(sp.closeWin.winner) || 0, loser: Number(sp.closeWin.loser) || 0 }
      : (def.closeWin || { winner: 2, loser: 1 });
    sp.loserThreshold = Number.isFinite(Number(sp.loserThreshold)) ? Number(sp.loserThreshold) : 0;
  }
  if(def.type === 'winner'){
    sp.winPoints = sp.winPoints ?? def.winPoints; sp.drawPoints = sp.drawPoints ?? def.drawPoints;
    sp.lossPoints = sp.lossPoints ?? 0; sp.allowDraw = sp.allowDraw ?? def.allowDraw;
  }
  sp.teams.forEach((tm, i) => { if(!tm.color) tm.color = COLORS[i % COLORS.length]; });
  return sp;
}

function validateState(s){
  if(!s || typeof s !== 'object') return null;
  const st = { sports:{}, settings:Object.assign({theme:'dark',lang:'fa'}, s.settings || {}) };
  SPORT_DEFS.forEach(def => { st.sports[def.id] = validateSport(s.sports && s.sports[def.id], def); });
  return st;
}

function migrateOld(){
  for(const key of OLD_KEYS){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) continue;
      const old = JSON.parse(raw);
      if(!old) continue;
      if(old.sports){ const v = validateState(old); if(v) return v; }
      if(Array.isArray(old.teams)){
        const st = defaultState();
        st.sports.football.teams = old.teams.map((tm,i) => ({ id: tm.id || 'f'+i, name: tm.name, color: tm.color || COLORS[i % COLORS.length] }));
        st.sports.football.matches = (old.matches || []).map(m => ({ id: m.id, home: m.home, away: m.away, hg: m.hg, ag: m.ag }));
        return st;
      }
    }catch(e){}
  }
  return null;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const v = validateState(JSON.parse(raw)); if(v) return v; }
    const m = migrateOld(); if(m) return m;
  }catch(e){}
  return defaultState();
}

function standingsScore(sp){
  const st = {};
  sp.teams.forEach(tm => { st[tm.id] = { id:tm.id, name:tm.name, color:tm.color, p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0 }; });
  const byScore = sp.scoreMode === 'byScore';
  const threshold = Number(sp.loserThreshold) || 0;
  const cw = sp.cleanWin || { winner: 3, loser: 0 };
  const clw = sp.closeWin || { winner: 2, loser: 1 };

  sp.matches.forEach(m => {
    const h = st[m.home], a = st[m.away]; if(!h || !a) return;
    h.p++; a.p++; h.gf += m.hg; h.ga += m.ag; a.gf += m.ag; a.ga += m.hg;

    if(m.hg > m.ag){
      h.w++; a.l++;
      if(byScore){
        const isClean = m.ag <= threshold;
        const rule = isClean ? cw : clw;
        h.pts += Number(rule.winner) || 0;
        a.pts += Number(rule.loser) || 0;
      }else{
        h.pts += sp.winPoints; a.pts += sp.lossPoints;
      }
    }else if(m.hg < m.ag){
      a.w++; h.l++;
      if(byScore){
        const isClean = m.hg <= threshold;
        const rule = isClean ? cw : clw;
        a.pts += Number(rule.winner) || 0;
        h.pts += Number(rule.loser) || 0;
      }else{
        a.pts += sp.winPoints; h.pts += sp.lossPoints;
      }
    }else{
      h.d++; a.d++;
      h.pts += sp.drawPoints; a.pts += sp.drawPoints;
    }
  });

  return Object.values(st).map(s => ({ ...s, gd: s.gf - s.ga }))
    .sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.name.localeCompare(y.name, state.settings.lang === 'fa' ? 'fa' : 'en'));
}

function standingsWinner(sp){
  const st = {};
  sp.teams.forEach(tm => { st[tm.id] = { id:tm.id, name:tm.name, color:tm.color, p:0,w:0,d:0,l:0,pts:0 }; });
  Object.values(sp.winners || {}).forEach(res => {
    if(!res || !res.a || !res.b) return;
    const h = st[res.a], a = st[res.b]; if(!h || !a) return;
    h.p++; a.p++;
    if(res.winner === 'a'){ h.w++; a.l++; h.pts += sp.winPoints; a.pts += sp.lossPoints; }
    else if(res.winner === 'b'){ a.w++; h.l++; a.pts += sp.winPoints; h.pts += sp.lossPoints; }
    else { h.d++; a.d++; h.pts += sp.drawPoints; a.pts += sp.drawPoints; }
  });
  return Object.values(st).sort((x,y) => y.pts - x.pts || y.w - x.w || x.name.localeCompare(y.name, state.settings.lang === 'fa' ? 'fa' : 'en'));
}

function standingsSolo(sp){
  return sp.teams.map(tm => ({ id: tm.id, name: tm.name, color: tm.color, score: Number(sp.soloScores[tm.id]) || 0, hasScore: sp.soloScores[tm.id] != null && sp.soloScores[tm.id] !== '' }))
    .sort((x,y) => y.score - x.score || x.name.localeCompare(y.name, state.settings.lang === 'fa' ? 'fa' : 'en'));
}

function standingsRank(sp){
  return sp.teams.map(tm => ({ id: tm.id, name: tm.name, color: tm.color, rank: Number(sp.ranks[tm.id]) || 9999, hasRank: sp.ranks[tm.id] != null && sp.ranks[tm.id] !== '' }))
    .sort((x,y) => x.rank - y.rank || x.name.localeCompare(y.name, state.settings.lang === 'fa' ? 'fa' : 'en'));
}

/* ============ BRACKET ============ */
function getRoundName(teamCount, roundIndex){
  if(teamCount <= 2) return t('final');
  if(teamCount <= 4) return t('semiFinal');
  if(teamCount <= 8) return t('quarterFinal');
  if(teamCount <= 16) return t('roundOf16');
  return t('round') + ' ' + num(roundIndex + 1);
}

function generateBracket(sp){
  if(sp.teams.length < MIN_TEAMS) return false;
  const teams = sp.teams.slice();
  for(let i = teams.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [teams[i], teams[j]] = [teams[j], teams[i]]; }
  const n = teams.length;
  const matches = [], byes = [];
  for(let i = 0; i < n; i += 2){
    if(i + 1 < n){ matches.push({ id: uid(), a: teams[i].id, b: teams[i+1].id, hg: null, ag: null, winner: null }); }
    else { byes.push(teams[i].id); }
  }
  sp.bracket = [{ name: getRoundName(n, 0), matches, byes }];
  sp.champion = null;
  return true;
}

function ensureBracketRounds(sp){
  if(!sp.bracket || !sp.bracket.length) return;
  let safety = 0;
  while(safety < 20){
    safety++;
    const lastIdx = sp.bracket.length - 1;
    const last = sp.bracket[lastIdx]; if(!last) break;
    if(last.matches.length === 0){ if(last.byes.length <= 1){ sp.champion = last.byes[0] || null; } break; }
    const allDone = last.matches.every(m => m.winner === 'a' || m.winner === 'b');
    if(!allDone) break;
    const winners = last.matches.map(m => m.winner === 'a' ? m.a : m.b);
    const nextTeams = [...winners, ...last.byes];
    if(nextTeams.length <= 1){ sp.champion = nextTeams[0] || null; break; }
    if(sp.bracket[lastIdx + 1]) break;
    const matches = [], byes = [];
    for(let i = 0; i < nextTeams.length; i += 2){
      if(i + 1 < nextTeams.length){ matches.push({ id: uid(), a: nextTeams[i], b: nextTeams[i+1], hg: null, ag: null, winner: null }); }
      else { byes.push(nextTeams[i]); }
    }
    sp.bracket.push({ name: getRoundName(nextTeams.length, sp.bracket.length), matches, byes });
  }
}

    : `<div class="empty" style="grid-column:1/-1"><span class="ico">🎪</span><p>${esc(t('noActiveSports'))}<br><span style="font-size:.78rem">${esc(t('noActiveSportsHint'))}</span></p></div>`;
  const cta = authed
    ? `<div class="admin-home-cta"><h3>🔓 ${esc(t('adminHome'))}</h3><p>${esc(t('adminHomeHint'))}</p><button class="btn primary" data-action="gotoAdmin">⚙️ ${esc(t('sportsManagement'))}</button></div>`
    : `<div class="admin-home-cta"><h3>🔒 ${esc(t('adminHome'))}</h3><p>${esc(t('adminHomeHint'))}</p><button class="btn" data-action="askPassword">🔑 ${esc(t('enterAdmin'))}</button></div>`;
  return `<div class="fade"><div class="sports-hero"><h2>${esc(t('sportsHero'))}</h2><p>${esc(t('sportsHeroSub'))}</p></div><div class="sports-grid">${cards}</div>${cta}</div>`;
}

function renderSportView(){
  const sp = getSport(currentSportId);
  if(!sp){ currentView = 'sports'; return renderSportsHome(); }
  const color = sportColor(sp.id);
  const ti = TYPE_INFO[sp.type] || TYPE_INFO.score;
  const isKnockout = (sp.type === 'score' || sp.type === 'winner') && sp.mode === 'knockout';
  let headerMeta = '';
  if(isKnockout){
    headerMeta = `${num(sp.teams.length)} ${t('teamsCount')} · ${t('knockoutActive')}`;
  }else if(sp.type === 'score'){
    headerMeta = `${num(sp.teams.length)} ${t('teamsCount')} · ${num(sp.matches.length)} ${t('matchesCount')}`;
  }else if(sp.type === 'winner'){
    headerMeta = `${num(sp.teams.length)} ${t('teamsCount')} · ${num(Object.keys(sp.winners||{}).length)} ${t('matchesCount')}`;
  }else{
    headerMeta = `${num(sp.teams.length)} ${t('teamsCount')} · ${ti.label}`;
  }
  const header = `
    <div class="sport-header" style="--sport-color:${color}">
      <button class="back-btn" data-action="goHome">↩</button>
      <div class="sport-header-icon">${esc(sp.icon)}</div>
      <div class="sport-header-info"><h2>${esc(sp.name)}</h2><p>${headerMeta}</p></div>
    </div>`;
  let content = '';
  if(currentTab === 'table'){
    if(isKnockout) content = renderBracketPublic(sp);
    else if(sp.type === 'score') content = renderTableScore(sp);
    else if(sp.type === 'winner') content = renderTableWinner(sp);
    else if(sp.type === 'solo') content = renderTableSolo(sp);
    else if(sp.type === 'rank') content = renderTableRank(sp);
    // Members section below table
    content += renderMembersPublic(sp);
  }else if(currentTab === 'matches'){
    if(isKnockout) content = renderBracketMatchesList(sp);
    else if(sp.type === 'score') content = renderMatchesScore(sp);
    else if(sp.type === 'winner') content = renderMatchesWinner(sp);
  }else if(currentTab === 'admin'){
    if(!authed){ currentTab = 'table'; return renderSportView(); }
    content = renderSportAdmin(sp);
  }
  return header + content;
}

function teamById(sp, id){ return sp.teams.find(x => x.id === id); }

function renderMembersPublic(sp){
  if(!sp.showMembers) return '';
  const teamsWithMembers = sp.teams.filter(tm => (sp.teamMembers[tm.id] || []).length > 0);
  if(!teamsWithMembers.length) return '';
  const cards = teamsWithMembers.map(tm => {
    const members = sp.teamMembers[tm.id] || [];
    const items = members.map(m => {
      const isCap = m.isCaptain && sp.showCaptain;
      return `
        <li class="member-item ${isCap ? 'captain' : ''}">
          ${isCap ? '<span class="cap-star">⭐</span>' : ''}
          <span class="member-name">${esc(m.name)}</span>
          ${isCap ? `<span class="cap-badge">${esc(t('captain'))}</span>` : ''}
        </li>
      `;
    }).join('');
    return `
      <div class="member-card">
        <div class="member-card-head">
          <span class="dot" style="background:${esc(tm.color)}"></span>
          <span class="name">${esc(tm.name)}</span>
          <span class="count">${num(members.length)} ${esc(t('membersCount'))}</span>
        </div>
        <ul class="member-list-public">${items}</ul>
      </div>
    `;
  }).join('');
  return `
    <div class="section fade">
      <div class="section-title">👥 ${esc(t('teamMembers'))}</div>
      <div class="members-grid">${cards}</div>
    </div>
  `;
}

function renderBracketPublic(sp){
  if(!sp.bracket || !sp.bracket.length){
    return `<div class="empty fade"><span class="ico">🏆</span><p>${esc(t('noBracket'))}<br><span style="font-size:.78rem">${esc(t('noBracketHint'))}</span></p></div>`;
  }
  const roundsHtml = sp.bracket.map((round) => {
    const matchRows = round.matches.map(m => {
      const a = teamById(sp, m.a), b = teamById(sp, m.b);
      if(!a || !b) return '';
      const isResolved = m.winner === 'a' || m.winner === 'b';
      const aCls = isResolved ? (m.winner === 'a' ? 'winner' : 'loser') : '';
      const bCls = isResolved ? (m.winner === 'b' ? 'winner' : 'loser') : '';
      return `
        <div class="bracket-match ${isResolved ? 'resolved' : ''}">
          <span class="bm-team a ${aCls}"><span>${esc(a.name)}</span><span class="tdot" style="background:${esc(a.color)}"></span></span>
          ${isResolved
            ? `<span class="bm-score-display ${m.winner === 'a' ? 'winner' : ''}">${num(m.hg)}</span>
               <span class="bm-sep">−</span>
               <span class="bm-score-display ${m.winner === 'b' ? 'winner' : ''}">${num(m.ag)}</span>`
            : `<span class="bm-score-display">?</span><span class="bm-sep">−</span><span class="bm-score-display">?</span>`}
          <span class="bm-team b ${bCls}"><span class="tdot" style="background:${esc(b.color)}"></span><span>${esc(b.name)}</span></span>
          <div></div>
        </div>`;
    }).join('');
    const byeRows = round.byes.map(teamId => {
      const tm = teamById(sp, teamId); if(!tm) return '';
      return `<div class="bm-bye">⏭️ ${esc(tm.name)} — ${esc(t('bye'))}</div>`;
    }).join('');
    return `
      <div class="bracket-round">
        <div class="bracket-round-title">🏁 ${esc(round.name)}<span class="rr-count">${num(round.matches.filter(m => m.winner).length)} / ${num(round.matches.length)}</span></div>
        ${matchRows || `<p style="color:var(--muted);font-size:.82rem;padding:8px 4px">—</p>`}
        ${byeRows}
      </div>`;
  }).join('');
  const championHtml = sp.champion ? (() => {
    const c = teamById(sp, sp.champion); if(!c) return '';
    return `
      <div class="champion-box">
        <span class="trophy">🏆</span>
        <h3>${esc(t('champion'))}</h3>
        <div class="champion-name"><span class="tdot" style="background:${esc(c.color)}"></span>${esc(c.name)}</div>
      </div>`;
  })() : '';
  return `<div class="section fade"><div class="hint-box">🏆 <b>${esc(t('knockoutActive'))}:</b> ${esc(t('bracketInfo'))}</div><div class="bracket-wrap">${roundsHtml}</div>${championHtml}</div>`;
}

function renderBracketMatchesList(sp){
  if(!sp.bracket || !sp.bracket.length){
    return `<div class="empty fade"><span class="ico">📋</span><p>${esc(t('noBracket'))}</p></div>`;
  }
  const allMatches = [];
  sp.bracket.forEach((round) => {
    round.matches.forEach(m => {
      if(m.winner === 'a' || m.winner === 'b'){ allMatches.push({ round: round.name, m }); }
    });
  });
  if(!allMatches.length){ return `<div class="empty fade"><span class="ico">📋</span><p>${esc(t('noMatches'))}</p></div>`; }
  const items = allMatches.reverse().map(({ m }) => {
    const a = teamById(sp, m.a), b = teamById(sp, m.b); if(!a || !b) return '';
    const aw = m.winner === 'a', bw = m.winner === 'b';
    return `
      <div class="match">
        <div class="m-team a"><span class="dot" style="background:${esc(a.color)}"></span><span>${esc(a.name)}</span></div>
        <div class="m-score"><span class="${aw?'win':''}">${num(m.hg)}</span><span style="opacity:.4">-</span><span class="${bw?'win':''}">${num(m.ag)}</span></div>
        <div class="m-team b"><span>${esc(b.name)}</span><span class="dot" style="background:${esc(b.color)}"></span></div>
      </div>`;
  }).join('');
  return `<div class="section fade"><div class="section-title">📋 ${esc(t('tabMatches'))}</div><div class="match-list">${items}</div></div>`;
}

    <div class="hint-box" style="margin-bottom:12px;font-size:.75rem">
      🎯 <b>${esc(t('scoringByScore'))}:</b>
      ${esc(t('cleanWin'))} (${esc(t('cleanWinExample'))}): ${num(sp.cleanWin?.winner ?? 3)} / ${num(sp.cleanWin?.loser ?? 0)} —
      ${esc(t('closeWin'))} (${esc(t('closeWinExample'))}): ${num(sp.closeWin?.winner ?? 2)} / ${num(sp.closeWin?.loser ?? 1)}
    </div>` : '';

      <td><div class="team-cell"><span class="dot" style="background:${esc(r.color)}"></span><span>${esc(r.name)}</span></div></td>
      <td>${num(r.p)}</td><td>${num(r.w)}</td><td>${num(r.d)}</td><td>${num(r.l)}</td>

}

  const rows = standingsRank(sp);
  if(!sp.teams.length) return emptyBox('🏃', t('noTeams'));

    <tr><td>${r.hasRank ? medalOrNum(r.rank - 1) : '<span class="rank-num">—</span>'}</td><td><div class="team-cell"><span class="dot" style="background:${esc(r.color)}"></span><span>${esc(r.name)}</span></div></td><td>${r.hasRank ? num(r.rank) : '—'}</td></tr>

function medalOrNum(i){
  if(i === 0) return '<span class="rank-medal g1">🥇</span>';
  if(i === 1) return '<span class="rank-medal g2">🥈</span>';
  if(i === 2) return '<span class="rank-medal g3">🥉</span>';
  return `<span class="rank-num">${num(i+1)}</span>`;
}

function emptyBox(icon, text){ return `<div class="empty fade"><span class="ico">${icon}</span><p>${esc(text)}</p></div>`; }

function renderMatchesScore(sp){
  const list = [...sp.matches].reverse();
  if(!list.length) return emptyBox('📋', t('noMatches'));
  const byScore = sp.scoreMode === 'byScore';
  const threshold = Number(sp.loserThreshold) || 0;
  const cw = sp.cleanWin || { winner: 3, loser: 0 };
  const clw = sp.closeWin || { winner: 2, loser: 1 };
  const items = list.map(m => {
    const h = sp.teams.find(x => x.id === m.home), a = sp.teams.find(x => x.id === m.away);
    if(!h || !a) return '';
    const hw = m.hg > m.ag, aw = m.ag > m.hg;
    let preview = '';
    if(byScore){
      if(hw){
        const clean = m.ag <= threshold;
        const r = clean ? cw : clw;
        preview = `<div class="score-preview">${clean ? '✅' : '🔥'} ${num(r.winner)} / ${num(r.loser)}</div>`;
      }else if(aw){
        const clean = m.hg <= threshold;
        const r = clean ? cw : clw;
        preview = `<div class="score-preview">${clean ? '✅' : '🔥'} ${num(r.winner)} / ${num(r.loser)}</div>`;
      }
    }
    return `<div class="match"><div class="m-team a"><span class="dot" style="background:${esc(h.color)}"></span><span>${esc(h.name)}</span></div><div class="m-score"><span class="${hw?'win':''}">${num(m.hg)}</span><span style="opacity:.4">-</span><span class="${aw?'win':''}">${num(m.ag)}</span></div><div class="m-team b"><span>${esc(a.name)}</span><span class="dot" style="background:${esc(a.color)}"></span></div>${preview}</div>`;
  }).join('');
  return `<div class="section fade"><div class="section-title">📋 ${esc(t('tabMatches'))}</div><div class="match-list">${items}</div></div>`;
}

function renderMatchesWinner(sp){
  const entries = Object.entries(sp.winners || {});
  if(!entries.length) return emptyBox('📋', t('noMatches'));
  const items = entries.slice().reverse().map(([key, res]) => {
    const a = sp.teams.find(x => x.id === res.a), b = sp.teams.find(x => x.id === res.b);
    if(!a || !b) return '';
    let badge = '';
    if(res.winner === 'a') badge = `<div class="m-winner-badge">🏆 ${esc(a.name)}</div>`;
    else if(res.winner === 'b') badge = `<div class="m-winner-badge">🏆 ${esc(b.name)}</div>`;
    else badge = `<div class="m-winner-badge" style="background:rgba(250,204,21,.2)">🤝 ${esc(t('draw'))}</div>`;
    return `<div class="match"><div class="m-team a"><span class="dot" style="background:${esc(a.color)}"></span><span>${esc(a.name)}</span></div>${badge}<div class="m-team b"><span>${esc(b.name)}</span><span class="dot" style="background:${esc(b.color)}"></span></div></div>`;
  }).join('');
  return `<div class="section fade"><div class="section-title">📋 ${esc(t('tabMatches'))}</div><div class="match-list">${items}</div></div>`;
}

function renderSportAdmin(sp){
  if(sp.type === 'score')  return renderAdminScore(sp);
  if(sp.type === 'winner') return renderAdminWinner(sp);
  if(sp.type === 'solo')   return renderAdminSolo(sp);
  if(sp.type === 'rank')   return renderAdminRank(sp);
  return '';
}

function teamListBlock(sp){
  const canAdd = sp.teams.length < MAX_TEAMS;
  const canDel = sp.teams.length > MIN_TEAMS;
  const showMembersBtn = sp.showMembers;
  const rows = sp.teams.length
    ? sp.teams.map(tm => {
        const memberCount = (sp.teamMembers[tm.id] || []).length;
        return `
        <div class="team-row">
          <button class="color-pick-btn" data-action="openPalette" data-sport="${sp.id}" data-id="${tm.id}" style="background:${esc(tm.color)}" title="${esc(t('pickColor'))}"></button>
          <input class="input" value="${esc(tm.name)}" maxlength="24" data-rename="${tm.id}" data-sport="${sp.id}">
          ${showMembersBtn ? `<button class="member-btn" data-action="openMembers" data-sport="${sp.id}" data-id="${tm.id}" title="${esc(t('manageMembers'))}">👥${memberCount > 0 ? `<span class="badge">${num(memberCount)}</span>` : ''}</button>` : ''}
          <button class="btn danger sm" data-action="delTeam" data-sport="${sp.id}" data-id="${tm.id}" ${canDel?'':'disabled'}>✕</button>
        </div>`;
      }).join('')
    : `<p style="color:var(--muted);font-size:.85rem;padding:8px 0">${esc(t('noTeams'))}</p>`;

    <div class="card" style="margin-bottom:14px">

        <input class="input" id="teamNameInput" maxlength="24" placeholder="${esc(t('teamName'))}" ${canAdd?'':'disabled'}>
        <button class="btn primary" type="submit" ${canAdd?'':'disabled'}>＋ ${esc(t('add'))}</button>
      </form>
      ${canAdd?'':`<p style="font-size:.78rem;color:var(--muted);margin:-6px 0 12px">${esc(t('maxTeams'))}</p>`}
      ${canDel?'':`<p style="font-size:.78rem;color:var(--muted);margin:-6px 0 12px">${esc(t('minTeams'))}</p>`}
      <div>${rows}</div>
    </div>`;
}

function renderAdminScore(sp){
  if(sp.mode === 'knockout') return renderAdminBracket(sp);
  const pairs = [];
  for(let i=0;i<sp.teams.length;i++){
    for(let j=i+1;j<sp.teams.length;j++){
      const a=sp.teams[i], b=sp.teams[j];
      const ex = sp.matches.find(m => (m.home===a.id && m.away===b.id) || (m.home===b.id && m.away===a.id));
      let hg='', ag='', matchId=null;
      if(ex){ matchId = ex.id; if(ex.home===a.id){ hg=ex.hg; ag=ex.ag; } else { hg=ex.ag; ag=ex.hg; } }
      pairs.push({a,b,hg,ag,matchId});
    }
  }
  const playedCount = pairs.filter(p => p.matchId).length;
  const byScore = sp.scoreMode === 'byScore';
  const byScoreHint = byScore ? `
    <div class="hint-box" style="margin-bottom:12px;font-size:.75rem">
      🎯 <b>${esc(t('scoringByScore'))}:</b>
      ${esc(t('cleanWin'))} (${esc(t('cleanWinExample'))}): <b>${num(sp.cleanWin?.winner ?? 3)}</b> / <b>${num(sp.cleanWin?.loser ?? 0)}</b> —
      ${esc(t('closeWin'))} (${esc(t('closeWinExample'))}): <b>${num(sp.closeWin?.winner ?? 2)}</b> / <b>${num(sp.closeWin?.loser ?? 1)}</b>
    </div>` : '';
  const rows = pairs.length
    ? pairs.map(p => `
        <div class="rr-row ${p.matchId?'played':''}">
          <span class="rr-team home"><span>${esc(p.a.name)}</span><span class="tdot" style="background:${esc(p.a.color)}"></span></span>
          <input class="rr-score" type="number" inputmode="numeric" min="0" max="${sp.maxScore}" value="${p.hg!==''?p.hg:''}" placeholder="–" data-score="hg" data-sport="${sp.id}">
          <span class="rr-vs">−</span>
          <input class="rr-score" type="number" inputmode="numeric" min="0" max="${sp.maxScore}" value="${p.ag!==''?p.ag:''}" placeholder="–" data-score="ag" data-sport="${sp.id}">
          <span class="rr-team away"><span class="tdot" style="background:${esc(p.b.color)}"></span><span>${esc(p.b.name)}</span></span>
          <div class="rr-actions">
            <button class="rr-btn save" data-action="savePair" data-sport="${sp.id}" data-a="${p.a.id}" data-b="${p.b.id}">✓</button>
            ${p.matchId?`<button class="rr-btn clear" data-action="clearPair" data-sport="${sp.id}" data-id="${p.matchId}">✕</button>`:''}
          </div>
        </div>`).join('')
    : `<p style="color:var(--muted);font-size:.85rem;padding:10px 0">${esc(t('needTwoTeams'))}</p>`;
  return `
    <div class="section fade">
      <div class="section-title">🔐 ${esc(t('adminPanel'))}<span style="margin-inline-start:auto;font-weight:600;text-transform:none">${num(playedCount)} / ${num(pairs.length)}</span></div>
      ${teamListBlock(sp)}
      <div class="card">
        <div class="section-title" style="margin:0 0 12px">⚽ ${esc(t('recordResults'))}</div>
        ${byScoreHint}
        <div class="rr-list">${rows}</div>
      </div>
    </div>`;
}

function renderAdminWinner(sp){
  if(sp.mode === 'knockout') return renderAdminBracket(sp);
  const pairs = [];
  for(let i=0;i<sp.teams.length;i++){
    for(let j=i+1;j<sp.teams.length;j++){
      const a=sp.teams[i], b=sp.teams[j];
      const key = a.id + '|' + b.id;
      const res = sp.winners[key] || null;
      pairs.push({a,b,key,res});
    }
  }
  const playedCount = pairs.filter(p => p.res).length;
  const rows = pairs.length
    ? pairs.map(p => {
        const r = p.res;
        const isA = r && r.winner === 'a', isB = r && r.winner === 'b', isD = r && r.winner === 'draw';
        return `
          <div class="wr-row ${r?'played':''}">

function renderAdminBracket(sp){
  const canGenerate = sp.teams.length >= MIN_TEAMS;
  let bracketHtml = '';
  if(!sp.bracket || !sp.bracket.length){
    bracketHtml = `<div class="empty" style="padding:30px 20px"><span class="ico">🏆</span><p>${esc(t('noBracket'))}<br><span style="font-size:.78rem">${esc(t('noBracketHint'))}</span></p></div>`;
  }else{
    bracketHtml = sp.bracket.map((round, ri) => {
      const matchRows = round.matches.map(m => {
        const a = teamById(sp, m.a), b = teamById(sp, m.b); if(!a || !b) return '';
        const isResolved = m.winner === 'a' || m.winner === 'b';
        const aCls = isResolved ? (m.winner === 'a' ? 'winner' : 'loser') : '';
        const bCls = isResolved ? (m.winner === 'b' ? 'winner' : 'loser') : '';
        return `
          <div class="bracket-match ${isResolved?'resolved':''}">
            <span class="bm-team a ${aCls}"><span>${esc(a.name)}</span><span class="tdot" style="background:${esc(a.color)}"></span></span>
            <input class="bm-score" type="number" inputmode="numeric" min="0" max="99" value="${m.hg != null ? m.hg : ''}" placeholder="–" data-bracket="hg" data-round="${ri}" data-match="${m.id}" data-sport="${sp.id}">
            <span class="bm-sep">−</span>
            <input class="bm-score" type="number" inputmode="numeric" min="0" max="99" value="${m.ag != null ? m.ag : ''}" placeholder="–" data-bracket="ag" data-round="${ri}" data-match="${m.id}" data-sport="${sp.id}">
            <span class="bm-team b ${bCls}"><span class="tdot" style="background:${esc(b.color)}"></span><span>${esc(b.name)}</span></span>
            <div class="bm-actions">
              <button class="bm-btn save" data-action="bracketSave" data-sport="${sp.id}" data-round="${ri}" data-match="${m.id}">✓</button>
              ${isResolved ? `<button class="bm-btn clear" data-action="bracketClear" data-sport="${sp.id}" data-round="${ri}" data-match="${m.id}">✕</button>` : ''}
            </div>
          </div>`;
      }).join('');
      const byeRows = round.byes.map(teamId => {
        const tm = teamById(sp, teamId); if(!tm) return '';
        return `<div class="bm-bye">⏭️ ${esc(tm.name)} — ${esc(t('bye'))}</div>`;
      }).join('');
      return `
        <div class="bracket-round">
          <div class="bracket-round-title">🏁 ${esc(round.name)}<span class="rr-count">${num(round.matches.filter(m => m.winner).length)} / ${num(round.matches.length)}</span></div>
          ${matchRows || `<p style="color:var(--muted);font-size:.82rem;padding:8px 4px">—</p>`}
          ${byeRows}
        </div>`;
    }).join('');
  }
  const championHtml = sp.champion ? (() => {
    const c = teamById(sp, sp.champion); if(!c) return '';
    return `
      <div class="champion-box">
        <span class="trophy">🏆</span>
        <h3>${esc(t('champion'))}</h3>
        <div class="champion-name"><span class="tdot" style="background:${esc(c.color)}"></span>${esc(c.name)}</div>
      </div>`;
  })() : '';
  const toolbar = sp.bracket && sp.bracket.length
    ? `<div class="bracket-toolbar">
         <button class="btn" data-action="generateBracket" data-sport="${sp.id}">🔄 ${esc(t('regenerateBracket'))}</button>
         <button class="btn danger" data-action="deleteBracket" data-sport="${sp.id}">🗑️ ${esc(t('deleteBracket'))}</button>
       </div>`
    : `<div class="bracket-toolbar">
         <button class="btn primary" data-action="generateBracket" data-sport="${sp.id}" ${canGenerate?'':'disabled'}>🏆 ${esc(t('generateBracket'))}</button>
       </div>
       <p style="font-size:.75rem;color:var(--muted);margin:-6px 4px 14px">${esc(t('generateBracketHint'))}</p>`;
  return `
    <div class="section fade">
      <div class="section-title">🔐 ${esc(t('adminPanel'))} — ${esc(t('modeKnockout'))}</div>
      <div class="hint-box">🏆 <b>${esc(t('knockoutActive'))}:</b> ${esc(t('modeHint'))}</div>
      ${teamListBlock(sp)}
      <div class="card">
        <div class="section-title" style="margin:0 0 12px">🏆 ${esc(t('tabBracket'))}</div>
        ${toolbar}
        <div class="bracket-wrap">${bracketHtml}</div>
        ${championHtml}
      </div>
    </div>`;
}

function bindTeamForm(){
  const form = document.getElementById('teamForm');
  if(!form) return;
  const sportId = form.dataset.sport;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const sp = getSport(sportId); if(!sp) return;
    const inp = document.getElementById('teamNameInput');
    const name = inp.value.trim();
    if(!name){ toast(t('enterTeamName')); return; }
    if(sp.teams.length >= MAX_TEAMS){ toast(t('maxTeams')); return; }
    if(sp.teams.some(x => x.name.trim().toLowerCase() === name.toLowerCase())){ toast(t('teamExists')); return; }
    sp.teams.push({ id: uid(), name, color: COLORS[sp.teams.length % COLORS.length] });
    save(); render(); toast(t('added'));
  });
}

/* ============ MEMBERS MODAL ============ */
function renderMembersModal(sportId, teamId){
  const sp = getSport(sportId); if(!sp) return '';
  const tm = sp.teams.find(x => x.id === teamId); if(!tm) return '';
  const members = sp.teamMembers[teamId] || [];
  const canAdd = members.length < MAX_MEMBERS;

  const rows = members.length
    ? members.map(m => `
        <div class="mm-row ${m.isCaptain && sp.showCaptain ? 'is-captain' : ''}">
          <span class="dot" style="background:${esc(tm.color)}"></span>
          <input class="mm-name-input" value="${esc(m.name)}" maxlength="30" data-member-rename="${m.id}" data-team="${teamId}" data-sport="${sportId}">
          <div class="mm-actions">
            ${sp.showCaptain ? `<button class="mm-btn cap-toggle ${m.isCaptain?'on':''}" data-action="toggleCaptain" data-sport="${sportId}" data-team="${teamId}" data-member="${m.id}" title="${esc(m.isCaptain ? t('unsetCaptain') : t('setCaptain'))}">⭐</button>` : ''}
            <button class="mm-btn del" data-action="delMember" data-sport="${sportId}" data-team="${teamId}" data-member="${m.id}" title="${esc(t('confirmDeleteMember'))}">✕</button>
          </div>
        </div>
      `).join('')
    : `<div class="mm-empty">${esc(t('noMembers'))}</div>`;

  return `
    <div class="modal-head">
      <h2>👥 ${esc(t('manageMembers'))}</h2>
      <button class="icon-btn sm" data-action="closeModal">✕</button>
    </div>
    <p class="modal-sub">
      <b style="color:${esc(tm.color)}">●</b> ${esc(tm.name)}
      ${sp.showCaptain ? ` — <span style="color:var(--accent-2)">⭐ ${esc(t('captain'))}</span>` : ''}
    </p>

    <div class="members-modal-list">${rows}</div>
    <div class="mm-counter">${num(members.length)} / ${num(MAX_MEMBERS)} — ${esc(t('members'))}</div>

    ${canAdd ? `
      <form class="row-form" id="addMemberForm" data-sport="${sportId}" data-team="${teamId}" style="margin-top:14px">
        <input class="input" id="memberNameInput" maxlength="30" placeholder="${esc(t('memberName'))}">
        <button class="btn primary" type="submit">＋ ${esc(t('addMember'))}</button>
      </form>
    ` : `<p style="font-size:.78rem;color:var(--muted);margin:14px 0 8px">${esc(t('maxMembers'))}</p>`}

    <button class="btn block" data-action="closeModal" style="margin-top:10px">${esc(t('close'))}</button>
  `;
}

function openMembers(sportId, teamId){
  const html = renderMembersModal(sportId, teamId);
  openModal(html);
  bindAddMemberForm();
}

function bindAddMemberForm(){
  const form = document.getElementById('addMemberForm');
  if(!form) return;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const sportId = form.dataset.sport;
    const teamId  = form.dataset.team;
    const sp = getSport(sportId); if(!sp) return;
    if(!sp.teamMembers[teamId]) sp.teamMembers[teamId] = [];
    const list = sp.teamMembers[teamId];
    if(list.length >= MAX_MEMBERS){ toast(t('maxMembers')); return; }
    const inp = document.getElementById('memberNameInput');
    const name = inp.value.trim();
    if(!name){ toast(t('enterMemberName')); return; }
    if(list.some(m => m.name.trim().toLowerCase() === name.toLowerCase())){ toast(t('memberExists')); return; }
    list.push({ id: uid(), name, isCaptain: false });
    save();
    // re-render modal
    openMembers(sportId, teamId);
    toast(t('memberAdded'));
  });
}

  document.getElementById('pwForm').addEventListener('submit', e => {
    e.preventDefault();
    const val = document.getElementById('pwInput').value;
    if(val === ADMIN_PASS){ authed = true; closeModal(); applySettings(); toast('✅ ' + t('adminPanel')); render(); }
    else{ const err = document.getElementById('pwErr'); err.textContent = t('wrongPassword'); const f = modalEl.querySelector('form'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); document.getElementById('pwInput').value = ''; }
  });
}

function openPalette(sportId, teamId){

  openModal(`
    <div class="modal-head"><h2>🎨 ${esc(t('pickColor'))}</h2><button class="icon-btn sm" data-action="closeModal">✕</button></div>
