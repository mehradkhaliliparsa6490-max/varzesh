/* ============ DEBUG ============ */
const DEBUG = {
  logs: [], max: 300, hasError: false,
  add(type, msg, data){
    const time = new Date().toLocaleTimeString('en-GB');
    this.logs.push({ time, type, msg, data, ts: Date.now() });
    if(this.logs.length > this.max) this.logs.shift();
    if(type === 'err') this.hasError = true;
    this.render(); this.updateBtn();
    const p = '[' + time + '][' + type.toUpperCase() + ']';
    if(type === 'err') console.error(p, msg, data||'');
    else if(type === 'warn') console.warn(p, msg, data||'');
    else console.log(p, msg, data||'');
  },
  ok(m,d){ this.add('ok',m,d); }, info(m,d){ this.add('info',m,d); },
  warn(m,d){ this.add('warn',m,d); }, err(m,d){ this.add('err',m,d); },
  clear(){ this.logs=[]; this.hasError=false; this.render(); this.updateBtn(); },
  render(){ const el=document.getElementById('debugLog'); if(!el)return;
    el.innerHTML = this.logs.slice().reverse().map(l=>{
      const cls = l.type==='ok'?'ok':l.type==='warn'?'warn':l.type==='err'?'err':'info';
      let e=''; if(l.data){ try{ e=' | '+(typeof l.data==='object'?JSON.stringify(l.data):l.data); }catch(err){ e=' | [object]'; } }
      return '<div class="row '+cls+'"><span class="time">'+l.time+'</span>['+l.type.toUpperCase()+'] '+String(l.msg)+e+'</div>';
    }).join('') || '<div class="info">No logs</div>';
  },
  updateBtn(){ const b=document.getElementById('debugToggle'); if(!b)return;
    b.classList.toggle('has-error', this.hasError);
    const ec=this.logs.filter(l=>l.type==='err').length;
    b.textContent = ec>0 ? '🐞'+ec : '🐞';
  }
};
window.addEventListener('error', e => DEBUG.err('Global', e.message));
window.addEventListener('unhandledrejection', e => DEBUG.err('Promise', e.reason ? String(e.reason) : ''));

function emptySeasonData(){ return { teams:[], matches:[], winners:{}, soloScores:{}, ranks:{}, bracket:null, champion:null }; }

function makeSport(def){
  const base = {
    id: def.id, name: def.name, icon: def.icon, type: def.type,
    unit: def.unit || 'امتیاز', unitPlural: def.unitPlural || def.unit || 'امتیاز',
    active: !!def.active, isCustom: !!def.isCustom, sportKind: def.sportKind || 'team',
    showMembers: false, showCaptain: false, showColorsInTable: true,
    visibleColumns: { played:true, won:true, drawn:true, lost:true, gf:true, ga:true, gd:true, points:true },
    customBracketMode: false, tugwarWinnerMode: false,
    seasons: [{ id: 'season1', name: 'فصل اول' }],
    currentSeasonId: 'season1', seasonsData: { 'season1': emptySeasonData() }
  };
  if(def.type === 'score'){
    base.winPoints = def.winPoints ?? 3; base.drawPoints = def.drawPoints ?? 1;
    base.lossPoints = 0; base.allowDraw = def.allowDraw ?? true; base.maxScore = 99;
    base.scoreMode = def.scoreMode || 'simple';
    base.cleanWin = def.cleanWin || { winner: 3, loser: 0 };
    base.closeWin = def.closeWin || { winner: 2, loser: 1 };
    base.loserThreshold = def.loserThreshold ?? 0;
  }
  if(def.type === 'winner'){
    base.winPoints = def.winPoints ?? 3; base.drawPoints = def.drawPoints ?? 0;
    base.lossPoints = 0; base.allowDraw = def.allowDraw ?? false;
  }
  return base;
}

function validateSport(sp, def){
  if(!sp || typeof sp !== 'object') return makeSport(def);
  sp.id = def.id; sp.type = def.type;
  sp.name = sp.name || def.name; sp.icon = sp.icon || def.icon;
  sp.unit = sp.unit || def.unit || 'امتیاز'; sp.unitPlural = sp.unitPlural || sp.unit || 'امتیاز';
  sp.active = !!sp.active; sp.isCustom = !!sp.isCustom;
  sp.sportKind = sp.sportKind === 'individual' ? 'individual' : 'team';
  sp.showMembers = !!sp.showMembers; sp.showCaptain = !!sp.showCaptain;
  sp.showColorsInTable = sp.showColorsInTable !== false;
  sp.visibleColumns = Object.assign({ played:true, won:true, drawn:true, lost:true, gf:true, ga:true, gd:true, points:true }, sp.visibleColumns || {});
  sp.customBracketMode = !!sp.customBracketMode; sp.tugwarWinnerMode = !!sp.tugwarWinnerMode;
  if(!Array.isArray(sp.seasons) || !sp.seasons.length) sp.seasons = [{ id: 'season1', name: 'فصل اول' }];
  if(!sp.seasonsData) sp.seasonsData = {};
  sp.seasons.forEach(sn => {
    if(!sp.seasonsData[sn.id]) sp.seasonsData[sn.id] = emptySeasonData();
    const sd = sp.seasonsData[sn.id];
    sd.teams = Array.isArray(sd.teams) ? sd.teams : [];
    sd.matches = Array.isArray(sd.matches) ? sd.matches : [];
    sd.winners = (sd.winners && typeof sd.winners === 'object') ? sd.winners : {};
    sd.soloScores = (sd.soloScores && typeof sd.soloScores === 'object') ? sd.soloScores : {};
    sd.ranks = (sd.ranks && typeof sd.ranks === 'object') ? sd.ranks : {};
    sd.bracket = Array.isArray(sd.bracket) ? sd.bracket : null;
    sd.champion = sd.champion || null;
    if(!sd.teamMembers) sd.teamMembers = {};
    sd.teams.forEach((tm, i) => { if(!tm.color) tm.color = COLORS[i % COLORS.length]; });
  });
  if(!sp.currentSeasonId || !sp.seasons.find(x => x.id === sp.currentSeasonId)) sp.currentSeasonId = sp.seasons[0].id;
  if(def.type === 'score'){
    sp.winPoints = sp.winPoints ?? 3; sp.drawPoints = sp.drawPoints ?? 1;
    sp.lossPoints = sp.lossPoints ?? 0; sp.allowDraw = sp.allowDraw ?? true;
    sp.maxScore = sp.maxScore ?? 99; sp.scoreMode = sp.scoreMode === 'byScore' ? 'byScore' : 'simple';
    sp.cleanWin = (sp.cleanWin && typeof sp.cleanWin === 'object') ? { winner: Number(sp.cleanWin.winner) || 0, loser: Number(sp.cleanWin.loser) || 0 } : { winner: 3, loser: 0 };
    sp.closeWin = (sp.closeWin && typeof sp.closeWin === 'object') ? { winner: Number(sp.closeWin.winner) || 0, loser: Number(sp.closeWin.loser) || 0 } : { winner: 2, loser: 1 };
    sp.loserThreshold = Number.isFinite(Number(sp.loserThreshold)) ? Number(sp.loserThreshold) : 0;
  }
  if(def.type === 'winner'){
    sp.winPoints = sp.winPoints ?? 3; sp.drawPoints = sp.drawPoints ?? 0;
    sp.lossPoints = sp.lossPoints ?? 0; sp.allowDraw = sp.allowDraw ?? false;
  }
  return sp;
}

  ];

  out.settings.servers.forEach(srv => {

// FIX: Compress image before storing to prevent quota issues
function compressImage(file, maxW = 900, quality = 0.65){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if(w > maxW){ h = Math.round((h * maxW) / w); w = maxW; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function convertVideoUrl(url){
  if(!url) return '';
  url = url.trim();
  // YouTube
  let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if(m) return { type:'iframe', src:'https://www.youtube.com/embed/' + m[1] };
  // Aparat
  m = url.match(/aparat\.com\/v\/([A-Za-z0-9]+)/);
  if(m) return { type:'iframe', src:'https://www.aparat.com/video/video/embed/videohash/' + m[1] + '/vt/frame' };
  // Direct video file
  if(/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(url)) return { type:'video', src:url };
  // Default - iframe try
  return { type:'iframe', src:url };
}

function standingsScore(sp){
  const sd = getCurrentSeason(sp);
  const st = {};
  sd.teams.forEach(tm => { st[tm.id] = { id:tm.id, name:tm.name, color:tm.color, p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0 }; });
  const byScore = sp.scoreMode === 'byScore', threshold = Number(sp.loserThreshold) || 0;
  const cw = sp.cleanWin || { winner: 3, loser: 0 }, clw = sp.closeWin || { winner: 2, loser: 1 };
  sd.matches.forEach(m => {
    const h = st[m.home], a = st[m.away]; if(!h || !a) return;
    h.p++; a.p++; h.gf += m.hg; h.ga += m.ag; a.gf += m.ag; a.ga += m.hg;
    if(m.hg > m.ag){ h.w++; a.l++; if(byScore){ const c = m.ag <= threshold; const r = c ? cw : clw; h.pts += Number(r.winner)||0; a.pts += Number(r.loser)||0; } else { h.pts += sp.winPoints; a.pts += sp.lossPoints; } }
    else if(m.hg < m.ag){ a.w++; h.l++; if(byScore){ const c = m.hg <= threshold; const r = c ? cw : clw; a.pts += Number(r.winner)||0; h.pts += Number(r.loser)||0; } else { a.pts += sp.winPoints; h.pts += sp.lossPoints; } }
    else { h.d++; a.d++; h.pts += sp.drawPoints; a.pts += sp.drawPoints; }
  });
  return Object.values(st).map(s => ({ ...s, gd: s.gf - s.ga })).sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.name.localeCompare(y.name, 'fa'));
}
function standingsWinner(sp){
  const sd = getCurrentSeason(sp);
  const st = {};
  sd.teams.forEach(tm => { st[tm.id] = { id:tm.id, name:tm.name, color:tm.color, p:0,w:0,d:0,l:0,pts:0 }; });
  Object.values(sd.winners || {}).forEach(res => {
    if(!res || !res.a || !res.b) return;
    const h = st[res.a], a = st[res.b]; if(!h || !a) return;
    h.p++; a.p++;
    if(res.winner === 'a'){ h.w++; a.l++; h.pts += sp.winPoints; a.pts += sp.lossPoints; }
    else if(res.winner === 'b'){ a.w++; h.l++; a.pts += sp.winPoints; h.pts += sp.lossPoints; }
    else { h.d++; a.d++; h.pts += sp.drawPoints; a.pts += sp.drawPoints; }
  });
  return Object.values(st).sort((x,y) => y.pts - x.pts || y.w - x.w || x.name.localeCompare(y.name, 'fa'));
}
const standingsSolo = sp => { const sd = getCurrentSeason(sp); return sd.teams.map(tm => ({ id:tm.id, name:tm.name, color:tm.color, score: Number(sd.soloScores[tm.id]) || 0, hasScore: sd.soloScores[tm.id] != null && sd.soloScores[tm.id] !== '' })).sort((x,y) => y.score - x.score || ((sd.soloTime||{})[x.id]||0) - ((sd.soloTime||{})[y.id]||0) || x.name.localeCompare(y.name, 'fa')); };
const standingsRank = sp => { const sd = getCurrentSeason(sp); return sd.teams.map(tm => ({ id:tm.id, name:tm.name, color:tm.color, rank: Number(sd.ranks[tm.id]) || 9999, hasRank: sd.ranks[tm.id] != null && sd.ranks[tm.id] !== '' })).sort((x,y) => x.rank - y.rank || x.name.localeCompare(y.name, 'fa')); };

/* ============ BRACKET ============ */
function getRoundName(matchCount, roundIndex){
  if(matchCount === 1) return 'فینال';
  if(matchCount === 2) return 'نیمه‌نهایی';
  if(matchCount === 4) return 'یک‌چهارم نهایی';
  if(matchCount === 8) return 'یک‌هشتم نهایی';
  return 'دور ' + (roundIndex + 1);
}
function generateFullBracket(sp){
  const sd = getCurrentSeason(sp);
  if(sd.teams.length < 2) return false;
  const teams = sd.teams.slice();
  for(let i = teams.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [teams[i], teams[j]] = [teams[j], teams[i]]; }
  const n = teams.length;
  const firstRoundMatches = Math.ceil(n / 2);
  const rounds = [];
  const r1 = [];
  for(let i = 0; i < firstRoundMatches; i++){
    const a = teams[i * 2] ? teams[i * 2].id : null;
    const b = teams[i * 2 + 1] ? teams[i * 2 + 1].id : null;
    r1.push({ id: uid(), a, b, hg: null, ag: null, winner: (a && !b) ? 'a' : ((!a && b) ? 'b' : null) });
  }
  rounds.push({ name: getRoundName(firstRoundMatches, 0), matches: r1 });
  let mc = Math.ceil(firstRoundMatches / 2);
  let ri = 1;
  while(true){
    const matches = [];
    for(let i = 0; i < mc; i++) matches.push({ id: uid(), a: null, b: null, hg: null, ag: null, winner: null });
    rounds.push({ name: getRoundName(mc, ri), matches });
    if(mc === 1) break;
    mc = Math.ceil(mc / 2);
    ri++;
  }
  sd.bracket = rounds;
  sd.champion = null;
  propagateBracket(sd);
  return true;
}
function propagateBracket(sd){
  if(!sd.bracket) return;
  for(let r = 0; r < sd.bracket.length - 1; r++){
    const round = sd.bracket[r], nextRound = sd.bracket[r + 1];
    if(!nextRound) continue;
    round.matches.forEach((m, i) => {
      const nextMatchIdx = Math.floor(i / 2);
      const slot = i % 2 === 0 ? 'a' : 'b';
      if(!nextRound.matches[nextMatchIdx]) return;
      if(m.winner === 'a' && m.a) nextRound.matches[nextMatchIdx][slot] = m.a;
      else if(m.winner === 'b' && m.b) nextRound.matches[nextMatchIdx][slot] = m.b;
      else if(!m.a && !m.b) nextRound.matches[nextMatchIdx][slot] = null;
    });
  }
  const finalRound = sd.bracket[sd.bracket.length - 1];
  const fm = finalRound.matches[0];
  if(fm && fm.winner){ sd.champion = fm.winner === 'a' ? fm.a : fm.b; }
  else sd.champion = null;
}

function doReset(){
  const checks = modalEl.querySelectorAll('input[data-reset]:checked');
  if(!checks.length){ toast(t('selectAtLeastOne')); return; }
  if(!confirm(t('confirmReset1'))) return;
  if(!confirm(t('confirmReset2'))) return;
  const actions = Array.from(checks).map(c => c.dataset.reset);
  actions.forEach(a => {
    if(a.startsWith('server:')){
      const sid = a.split(':')[1];
      if(state.serverData[sid]) state.serverData[sid] = defaultServerData();
    } else if(a === 'allServers'){
      state.settings.servers.forEach(s => { state.serverData[s.id] = defaultServerData(); });
    } else if(a === 'allResults'){
      Object.keys(state.serverData).forEach(sid => {
        const root = state.serverData[sid];
        if(root && root.sports){
          Object.values(root.sports).forEach(sp => {
            sp.seasons = [{ id: 'season1', name: 'فصل اول' }];
            sp.currentSeasonId = 'season1';
            sp.seasonsData = { 'season1': emptySeasonData() };
          });
        }
      });
    } else if(a === 'allNews'){ state.news = []; }
    else if(a === 'allFeedback'){ state.feedback = []; }
    else if(a === 'allSite'){
      state = defaultState();
      currentServerId = state.settings.servers[0].id;
      try { localStorage.setItem(SERVER_SEL_KEY, currentServerId); } catch(e){}
    }
  });
  save(); closeModal(); render(); toast('✅ ' + t('resetDone'));
}

/* ============ RENDER ============ */
let currentView = 'sports', currentSportId = null, currentTab = 'table';
let currentNewsId = null, currentNewsSearch = '', currentNewsTagFilter = null;
let currentFbId = null;

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  if(currentView !== 'sport' && currentView !== 'news' && currentView !== 'feedback'){ tabsEl.style.display = 'none'; return; }
  tabsEl.style.display = '';
  let tabs = [];
  if(currentView === 'sport'){
    const sp = getSport(currentSportId);
    if(!sp){ tabsEl.style.display = 'none'; return; }
    const isKnockout = (sp.type === 'score' || sp.type === 'winner') && sp.mode === 'knockout';
    tabs.push({ id:'table', icon: isKnockout ? '🏆' : '📊', label: isKnockout ? t('tabBracket') : t('tabTable') });
    if(sp.type === 'score' || sp.type === 'winner') tabs.push({ id:'matches', icon:'📋', label:t('tabMatches') });
    if(authed) tabs.push({ id:'admin', icon:'🔐', label:t('tabAdmin') });
  } else if(currentView === 'news') tabs.push({ id:'newsList', icon:'📰', label:t('tabNews') });
  else if(currentView === 'feedback') tabs.push({ id:'feedbackList', icon:'💬', label:t('tabFeedback') });
  tabsEl.innerHTML = tabs.map(tb => '<button class="tab ' + (currentTab === tb.id ? 'active' : '') + '" data-action="tab" data-tab="' + tb.id + '"><span>' + tb.icon + '</span><span>' + esc(tb.label) + '</span></button>').join('');
}

function render(){
  applySettings(); renderTabs();
  const main = document.getElementById('view');
  if(currentView === 'sports') main.innerHTML = renderSportsHome();
  else if(currentView === 'sport') main.innerHTML = renderSportView();
  else if(currentView === 'admin') main.innerHTML = renderAdminHome();
  else if(currentView === 'news') main.innerHTML = renderNews();
  else if(currentView === 'feedback') main.innerHTML = renderFeedback();
  else main.innerHTML = renderSportsHome();
  if(currentView === 'sport' && currentTab === 'admin') bindTeamForm();
  updateStatusBar();
  updateActionButtons();
  updateFbBadge();
}

function renderSportsHome(){
  const list = activeSports();
  const cards = list.length ? list.map(s => {
    const color = sportColor(s.id);
    const sd = getCurrentSeason(s);
    const isKnockout = (s.type === 'score' || s.type === 'winner') && s.mode === 'knockout';
    const kindBadge = s.sportKind === 'individual' ? '👤' : '👥';
    const badgeLabel = isKnockout ? '🏆 حذفی' : (TYPE_INFO[s.type]?.icon||'⚽') + ' ' + sportTypeLabel(s);
    const mCount = isKnockout && sd.bracket ? sd.bracket.reduce((sum, r) => sum + r.matches.length, 0) : (s.type === 'score' ? sd.matches.length : Object.keys(sd.winners||{}).length);
    const meta = '<span>👥 ' + num(sd.teams.length) + '</span><span>📋 ' + num(mCount) + '</span>';
    return '<div class="sport-card" data-action="openSport" data-id="' + s.id + '" style="--sport-color:' + color + '"><span class="sport-icon">' + esc(s.icon) + '</span><h3 class="sport-name">' + esc(sportName(s)) + '</h3><span class="sport-type-badge">' + badgeLabel + ' · ' + kindBadge + '</span><div class="sport-meta">' + meta + '</div></div>';
  }).join('') : '<div class="empty" style="grid-column:1/-1"><span class="ico">🎪</span><p>' + esc(t('noActiveSports')) + '<br><span style="font-size:.78rem">' + esc(t('noActiveSportsHint')) + '</span></p></div>';

function renderSportView(){
  const sp = getSport(currentSportId);
  if(!sp){ currentView = 'sports'; return renderSportsHome(); }
  const color = sportColor(sp.id);
  const isKnockout = (sp.type === 'score' || sp.type === 'winner') && sp.mode === 'knockout';
  const sd = getCurrentSeason(sp);
  let headerMeta = '';
  if(isKnockout) headerMeta = num(sd.teams.length) + ' ' + t('teamsCount') + ' · ' + t('knockoutActive');
  else if(sp.type === 'score') headerMeta = num(sd.teams.length) + ' ' + t('teamsCount') + ' · ' + num(sd.matches.length) + ' ' + t('matchesCount');
  else if(sp.type === 'winner') headerMeta = num(sd.teams.length) + ' ' + t('teamsCount') + ' · ' + num(Object.keys(sd.winners||{}).length) + ' ' + t('matchesCount');
  else headerMeta = num(sd.teams.length) + ' ' + t('teamsCount') + ' · ' + sportTypeLabel(sp);
  const seasonBar = sp.seasons.length > 1 ? '<div class="season-bar">' + sp.seasons.map(sn => '<div class="season-chip ' + (sn.id===sp.currentSeasonId?'active':'') + '" data-action="switchSeason" data-sport="' + sp.id + '" data-season="' + sn.id + '">' + esc(sn.name) + '</div>').join('') + '</div>' : '';
  const header = '<div class="sport-header" style="--sport-color:' + color + '"><button class="back-btn" data-action="goSportsHome">↩</button><div class="sport-header-icon">' + esc(sp.icon) + '</div><div class="sport-header-info"><h2>' + esc(sportName(sp)) + '</h2><p>' + headerMeta + '</p></div></div>';
  let content = seasonBar;
  if(currentTab === 'table'){
    if(isKnockout) content += renderBracketPublic(sp);
    else if(sp.type === 'score') content += renderTableScore(sp);
    else if(sp.type === 'winner') content += renderTableWinner(sp);
    else if(sp.type === 'solo') content += renderTableSolo(sp);
    else if(sp.type === 'rank') content += renderTableRank(sp);
    content += renderMembersPublic(sp);
  } else if(currentTab === 'matches'){
    if(isKnockout) content += renderBracketMatchesList(sp);
    else if(sp.type === 'score') content += renderMatchesScore(sp);
    else if(sp.type === 'winner') content += renderMatchesWinner(sp);
  } else if(currentTab === 'admin'){
    if(!authed){ currentTab = 'table'; return renderSportView(); }
    content += renderSportAdmin(sp);
  }
  return header + content;
}

function renderMatchesScore(sp){
  const sd = getCurrentSeason(sp);
  const list = [...sd.matches].reverse();
  if(!list.length) return emptyBox('📋', t('noMatches'));
  const byScore = sp.scoreMode === 'byScore', threshold = Number(sp.loserThreshold) || 0;
  const cw = sp.cleanWin || { winner: 3, loser: 0 }, clw = sp.closeWin || { winner: 2, loser: 1 };
  const items = list.map(m => {
    const h = sd.teams.find(x => x.id === m.home), a = sd.teams.find(x => x.id === m.away); if(!h || !a) return '';
    const hw = m.hg > m.ag, aw = m.ag > m.hg;
    let preview = '';
    if(byScore){ if(hw){ const c = m.ag <= threshold; const r = c ? cw : clw; preview = '<div class="score-preview">' + (c ? '✅' : '🔥') + ' ' + num(r.winner) + '/' + num(r.loser) + '</div>'; } else if(aw){ const c = m.hg <= threshold; const r = c ? cw : clw; preview = '<div class="score-preview">' + (c ? '✅' : '🔥') + ' ' + num(r.winner) + '/' + num(r.loser) + '</div>'; } }
    return '<div class="match"><div class="m-team a"><span class="dot" style="background:' + esc(h.color) + '"></span><span>' + esc(h.name) + '</span></div><div class="m-score"><span class="' + (hw?'win':'') + '">' + num(m.hg) + '</span><span style="opacity:.4">-</span><span class="' + (aw?'win':'') + '">' + num(m.ag) + '</span></div><div class="m-team b"><span>' + esc(a.name) + '</span><span class="dot" style="background:' + esc(a.color) + '"></span></div>' + preview + '</div>';
  }).join('');
  return '<div class="section fade"><div class="section-title">📋 ' + t('tabMatches') + '</div><div class="match-list">' + items + '</div></div>';
}

function renderMatchesWinner(sp){

function renderAdminScore(sp){
  const sd = getCurrentSeason(sp);
  const pairs = [];
  for(let i=0;i<sd.teams.length;i++) for(let j=i+1;j<sd.teams.length;j++){
    const a=sd.teams[i], b=sd.teams[j];
    const ex = sd.matches.find(m => (m.home===a.id && m.away===b.id) || (m.home===b.id && m.away===a.id));
    let hg='', ag='', matchId=null;
    if(ex){ matchId = ex.id; if(ex.home===a.id){ hg=ex.hg; ag=ex.ag; } else { hg=ex.ag; ag=ex.hg; } }
    pairs.push({a,b,hg,ag,matchId});
  }
  const playedCount = pairs.filter(p => p.matchId).length;
  const isTugwarWinner = sp.id === 'tugwar' && sp.tugwarWinnerMode;
  const rows = pairs.length ? pairs.map(p => {
    if(isTugwarWinner){
      const key = p.a.id + '|' + p.b.id;
      const res = sd.winners[key] || null;
      const isA = res && res.winner === 'a', isB = res && res.winner === 'b', isD = res && res.winner === 'draw';

function renderAdminBracket(sp){
  const sd = getCurrentSeason(sp);
  const canGen = sd.teams.length >= 2;
  let bracketHtml = '';
  if(!sd.bracket || !sd.bracket.length){
    bracketHtml = '<div class="empty" style="padding:30px 20px"><span class="ico">🏆</span><p>' + t('noBracket') + '<br><span style="font-size:.78rem">' + t('noBracketHint') + '</span></p></div>';
  } else {
    bracketHtml = sd.bracket.map((round, ri) => {
      const matchRows = round.matches.map(m => {
        const a = sd.teams.find(x => x.id === m.a), b = sd.teams.find(x => x.id === m.b);
        const isRes = m.winner === 'a' || m.winner === 'b';
        const aCls = isRes ? (m.winner === 'a' ? 'winner' : 'loser') : '';
        const bCls = isRes ? (m.winner === 'b' ? 'winner' : 'loser') : '';
        const aHtml = a ? '<span>' + esc(a.name) + '</span><span class="tdot" style="background:' + esc(a.color) + '"></span>' : '<span class="empty">در انتظار</span>';
        const bHtml = b ? '<span class="tdot" style="background:' + esc(b.color) + '"></span><span>' + esc(b.name) + '</span>' : '<span class="empty">در انتظار</span>';
        const canEdit = a && b;
        return '<div class="bracket-match"><span class="bm-team a ' + aCls + '">' + aHtml + '</span><input class="bm-score" type="number" inputmode="numeric" min="0" max="99" value="' + (m.hg != null ? m.hg : '') + '" placeholder="–" ' + (canEdit ? '' : 'disabled') + ' data-bracket="hg" data-round="' + ri + '" data-match="' + m.id + '" data-sport="' + sp.id + '"><span class="bm-sep">−</span><input class="bm-score" type="number" inputmode="numeric" min="0" max="99" value="' + (m.ag != null ? m.ag : '') + '" placeholder="–" ' + (canEdit ? '' : 'disabled') + ' data-bracket="ag" data-round="' + ri + '" data-match="' + m.id + '" data-sport="' + sp.id + '"><span class="bm-team b ' + bCls + '">' + bHtml + '</span><div class="rr-actions">' + (canEdit ? '<button class="rr-btn save" data-action="bracketSave" data-sport="' + sp.id + '" data-round="' + ri + '" data-match="' + m.id + '">✓</button>' : '') + (isRes ? '<button class="rr-btn clear" data-action="bracketClear" data-sport="' + sp.id + '" data-round="' + ri + '" data-match="' + m.id + '">✕</button>' : '') + '</div></div>';
      }).join('');
      return '<div class="bracket-round"><div class="bracket-round-title">🏁 ' + esc(round.name) + '<span style="margin-inline-start:auto;font-weight:600;font-size:.7rem">' + num(round.matches.filter(m => m.winner).length) + ' / ' + num(round.matches.length) + '</span></div>' + matchRows + '</div>';
    }).join('');
  }
  const toolbar = sd.bracket && sd.bracket.length
    ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn" data-action="generateBracket" data-sport="' + sp.id + '">🔄 ' + t('regenerateBracket') + '</button><button class="btn danger" data-action="deleteBracket" data-sport="' + sp.id + '">🗑️ ' + t('deleteBracket') + '</button></div>'
    : '<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn primary" data-action="generateBracket" data-sport="' + sp.id + '" ' + (canGen?'':'disabled') + '>🏆 ' + t('generateBracket') + '</button></div>';
  const champ = sd.champion ? (() => { const c = sd.teams.find(x => x.id === sd.champion); if(!c) return ''; return '<div class="champion-box"><span class="trophy">🏆</span><h3>' + t('champion') + '</h3><div class="champion-name"><span class="tdot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</div></div>'; })() : '';
  return '<div class="section fade"><div class="section-title">🔐 ' + t('adminPanel') + '</div><div class="hint-box">🏆 <b>' + t('knockoutActive') + '</b></div>' + teamListBlock(sp) + '<div class="card"><div class="section-title" style="margin:0 0 12px">🏆 ' + t('tabBracket') + '</div>' + toolbar + '<div>' + bracketHtml + '</div>' + champ + '</div></div>';
}

function bindTeamForm(){
  const form = document.getElementById('teamForm'); if(!form) return;
  const sportId = form.dataset.sport;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const sp = getSport(sportId); if(!sp) return;
    const sd = getCurrentSeason(sp);
    const inp = document.getElementById('teamNameInput');
    const name = inp.value.trim();
    if(!name){ toast(t('enterTeamName')); return; }
    if(sd.teams.some(x => x.name.trim().toLowerCase() === name.toLowerCase())){ toast(t('teamExists')); return; }
    sd.teams.push({ id: uid(), name, color: COLORS[sd.teams.length % COLORS.length] });
    save(); render(); toast(t('added'));
  });
  const mmForm = document.getElementById('manualMatchForm');
  if(mmForm) mmForm.addEventListener('submit', e => {
    e.preventDefault();
    const sp2 = getSport(mmForm.dataset.sport); if(!sp2) return;
    const sd2 = getCurrentSeason(sp2);
    const a = document.getElementById('mmHome').value, b = document.getElementById('mmAway').value;
    if(a === b){ toast('تیم‌ها باید متفاوت باشن'); return; }
    if(!sd2.manualMatches) sd2.manualMatches = [];
    sd2.manualMatches.push({ id: uid(), a, b, hg: null, ag: null });
    save(); render(); toast(t('added'));
  });
}

/* ============ NEWS ============ */
function canEditNews(n){
  return !!authed;
}

function renderNews(){
  if(currentNewsId) return renderNewsDetail();
  const tags = state.newsTags || [];
  const news = state.news || [];
  const canPost = authed;
  let filtered = news.slice().sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
  if(currentNewsTagFilter) filtered = filtered.filter(n => (n.tags||[]).includes(currentNewsTagFilter));
  if(currentNewsSearch.trim()){
    const q = currentNewsSearch.toLowerCase();
    filtered = filtered.filter(n => (n.title||'').toLowerCase().includes(q) || (n.intro||'').toLowerCase().includes(q) || (n.author||'').toLowerCase().includes(q));
  }
  const searchBox = '<div class="search-box"><input class="input" type="text" placeholder="' + t('searchNews') + '" id="newsSearchInput" value="' + esc(currentNewsSearch) + '"></div>';
  const tagFilter = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><div class="news-tag ' + (!currentNewsTagFilter?'active':'') + '" data-action="filterTag" data-tag="">' + t('allTags') + '</div>' + tags.map(tg => '<div class="news-tag ' + (currentNewsTagFilter===tg.id?'active':'') + '" data-action="filterTag" data-tag="' + tg.id + '">' + esc(tg.name) + '</div>').join('') + '</div>';
  const createBtn = canPost ? '<button class="btn primary block" data-action="createNews" style="margin-bottom:14px">✍️ ' + t('createNews') + '</button>' : '';
  const grid = filtered.length ? '<div class="news-grid">' + filtered.map(n => {
    const nt = (n.tags||[]).map(tid => tags.find(x => x.id === tid)).filter(Boolean);
    const cover = n.cover ? '<img class="cover" src="' + n.cover + '" alt="" loading="lazy">' : '';
    return '<div class="news-card" data-action="viewNews" data-id="' + n.id + '">' + cover + '<div class="meta"><span>👤 ' + esc(n.author || 'ناشناس') + '</span><span>📅 ' + esc(n.date || '') + '</span></div><h3>' + esc(n.title) + '</h3><div class="intro">' + esc(n.intro) + '</div><div class="news-tags">' + nt.map(tg => '<span class="news-tag static">' + esc(tg.name) + '</span>').join('') + '</div></div>';
  }).join('') + '</div>' : '<div class="empty fade"><span class="ico">📰</span><p>' + t('noNews') + '</p></div>';
  return '<div class="fade">' + createBtn + searchBox + tagFilter + grid + '</div>';
}

function renderNewsDetail(){
  const n = state.news.find(x => x.id === currentNewsId);
  if(!n){ currentNewsId = null; return renderNews(); }
  const tags = state.newsTags || [];
  const nt = (n.tags||[]).map(tid => tags.find(x => x.id === tid)).filter(Boolean);
  const editable = canEditNews(n);
  let actions = '';
  if(editable){
    actions = '<div class="actions"><button class="btn" data-action="editNews" data-id="' + n.id + '">✏️ ' + t('editNews') + '</button>';
    if(authed) actions += '<button class="btn danger" data-action="deleteNews" data-id="' + n.id + '">🗑️ ' + t('deleteNews') + '</button>';
    actions += '</div>';
  }
  const cover = n.cover ? '<img class="cover" src="' + n.cover + '" alt="">' : '';
  const content = n.contentHtml ? n.contentHtml : esc(n.content || '').replace(/\n/g, '<br>');
  return '<div class="fade"><button class="btn sm" data-action="closeNews" style="margin-bottom:14px">↩ بازگشت</button><div class="card news-detail">' + cover + '<h2>' + esc(n.title) + '</h2><div class="info"><span>👤 ' + esc(n.author || 'ناشناس') + '</span><span>📅 ' + esc(n.date || '') + '</span></div><p style="font-size:.9rem;color:var(--muted);line-height:1.8;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">' + esc(n.intro) + '</p><div class="content">' + content + '</div><div class="news-tags" style="margin-top:16px">' + nt.map(tg => '<span class="news-tag static">' + esc(tg.name) + '</span>').join('') + '</div>' + actions + '</div></div>';
}

function openNewsForm(editId){
  const editing = editId ? state.news.find(x => x.id === editId) : null;
  if(editing && !canEditNews(editing)){ toast(t('editPermission')); return; }
  const tags = state.newsTags || [];
  const activeTagIds = editing ? (editing.tags || []) : [];
  const tagChips = '<div class="tag-selector" id="newsTagSelector">' + tags.map(tg => '<div class="tag-chip ' + (activeTagIds.includes(tg.id) ? 'active' : '') + '" data-tag="' + tg.id + '">' + esc(tg.name) + '</div>').join('') + '</div>';
  const today = editing ? (editing.date || new Date().toLocaleDateString('fa-IR')) : new Date().toLocaleDateString('fa-IR');
  const title = editing ? editing.title : '';
  const intro = editing ? editing.intro : '';
  const author = editing ? editing.author : '';
  const contentHtml = editing ? (editing.contentHtml || esc(editing.content || '').replace(/\n/g,'<br>')) : '';
  openModal(
    '<div class="modal-head"><h2>' + (editing ? '✏️ ' + t('editNews') : '✍️ ' + t('createNews')) + '</h2><button class="icon-btn sm" data-action="closeModal">✕</button></div>' +
    '<form id="newsForm" data-edit-id="' + (editing ? editing.id : '') + '" style="display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow-y:auto">' +
    '<div class="field"><label>' + t('newsTitle') + '</label><input class="input" type="text" id="nfTitle" maxlength="120" value="' + esc(title) + '" required></div>' +
    '<div class="field"><label>' + t('newsCover') + '</label><input type="file" accept="image/*" id="nfCover" style="display:none"><button type="button" class="btn block" id="nfCoverBtn">📷 ' + t('addImage') + '</button><div id="nfCoverPreview" style="margin-top:8px">' + (editing && editing.cover ? '<img src="' + editing.cover + '" style="max-width:100%;border-radius:12px;max-height:180px">' : '') + '</div></div>' +
    '<div class="field"><label>' + t('newsIntro') + '</label><textarea class="input" id="nfIntro" maxlength="400" required>' + esc(intro) + '</textarea></div>' +
    '<div class="field"><label>' + t('newsContent') + '</label><div class="editor-toolbar"><button type="button" class="editor-btn" id="nfAddImg">🖼️ ' + t('addImage') + '</button><button type="button" class="editor-btn" id="nfAddVidUrl">🔗 ' + t('addVideoUrl') + '</button></div><div class="editor-content" id="nfContent" contenteditable="true" data-placeholder="متن خبر...">' + contentHtml + '</div><input type="file" accept="image/*" id="nfImgInput" style="display:none"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field"><label>' + t('newsAuthor') + '</label><input class="input" type="text" id="nfAuthor" maxlength="40" value="' + esc(author) + '" required></div><div class="field"><label>' + t('newsDate') + '</label><input class="input" type="text" id="nfDate" value="' + esc(today) + '" placeholder="' + t('dateHint') + '"></div></div>' +
    '<div class="field"><label>' + t('selectTags') + '</label>' + tagChips + '</div>' +
    '<button class="btn primary block" type="submit">💾 ' + t('save') + '</button>' +
    '<button class="btn block" type="button" data-action="closeModal">' + t('cancel') + '</button>' +
    '</form>'
  );
  const selectedTags = new Set(activeTagIds);
  modalEl.querySelectorAll('.tag-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const id = chip.dataset.tag;
      if(selectedTags.has(id)){ selectedTags.delete(id); chip.classList.remove('active'); }
      else { selectedTags.add(id); chip.classList.add('active'); }
    });
  });
  let coverData = editing ? (editing.cover || '') : '';
  const coverInput = document.getElementById('nfCover');
  document.getElementById('nfCoverBtn').addEventListener('click', () => coverInput.click());
  coverInput.addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    toast(t('compressing'));
    try {
      coverData = await compressImage(f, 900, 0.6);
      document.getElementById('nfCoverPreview').innerHTML = '<img src="' + coverData + '" style="max-width:100%;border-radius:12px;max-height:180px">';
    } catch(err){ toast('خطا در فشرده‌سازی'); }
  });
  const imgInput = document.getElementById('nfImgInput');
  document.getElementById('nfAddImg').addEventListener('click', () => imgInput.click());
  imgInput.addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    toast(t('compressing'));
    try {
      const dataUrl = await compressImage(f, 800, 0.55);
      const editor = document.getElementById('nfContent');
      const img = document.createElement('img');
      img.src = dataUrl;
      editor.appendChild(img);
      editor.appendChild(document.createElement('br'));
      toast(t('imageAdded'));
    } catch(err){ toast('خطا در فشرده‌سازی'); }
  });
  document.getElementById('nfAddVidUrl').addEventListener('click', () => {
    const url = prompt(t('videoUrlPrompt'), '');
    if(!url) return;
    const v = convertVideoUrl(url);
    if(!v || !v.src){ toast('لینک نامعتبر'); return; }
    const editor = document.getElementById('nfContent');
    if(v.type === 'video'){
      const vid = document.createElement('video');
      vid.src = v.src; vid.controls = true;
      editor.appendChild(vid);
    } else {
      const iframe = document.createElement('iframe');
      iframe.src = v.src; iframe.setAttribute('allowfullscreen','');
      editor.appendChild(iframe);
    }
    editor.appendChild(document.createElement('br'));
    toast(t('videoAdded'));
  });
  document.getElementById('newsForm').addEventListener('submit', e => {
    e.preventDefault();
    const editor = document.getElementById('nfContent');
    const editIdVal = document.getElementById('newsForm').dataset.editId;
    const data = {
      title: document.getElementById('nfTitle').value.trim(),
      intro: document.getElementById('nfIntro').value.trim(),
      contentHtml: editor.innerHTML,
      content: editor.innerText,
      cover: coverData,
      author: document.getElementById('nfAuthor').value.trim(),
      date: document.getElementById('nfDate').value.trim(),
      tags: Array.from(selectedTags)
    };
    if(!data.title || !data.intro){ toast('عنوان و مقدمه الزامی هستن'); return; }
    if(editIdVal){
      const idx = state.news.findIndex(x => x.id === editIdVal);
      if(idx < 0) return;
      if(!canEditNews(state.news[idx])){ toast(t('editPermission')); return; }
      state.news[idx] = Object.assign({}, state.news[idx], data);
      save(); closeModal(); render(); toast('✅ ' + t('newsEdited'));
    } else {
      state.news.push(Object.assign({ id: 'news_' + Date.now(), authorId: _myClientId, createdAt: Date.now() }, data));
      save(); closeModal(); render(); toast('✅ ' + t('newsAdded'));
    }
  });
}

/* ============ HANDLERS ============ */
function handleSavePair(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  const sd = getCurrentSeason(sp);
  const row = btn.closest('.rr-row');
  const hgS = row.querySelector('[data-score="hg"]').value.trim(), agS = row.querySelector('[data-score="ag"]').value.trim();
  if(hgS === '' || agS === ''){ toast(t('fillScores')); return; }
  const hg = Math.max(0, Math.min(sp.maxScore || 99, parseInt(hgS,10)||0));
  const ag = Math.max(0, Math.min(sp.maxScore || 99, parseInt(agS,10)||0));
  const aId = btn.dataset.a, bId = btn.dataset.b;
  const ex = sd.matches.find(m => (m.home===aId && m.away===bId) || (m.home===bId && m.away===aId));
  if(ex){ if(ex.home===aId){ ex.hg=hg; ex.ag=ag; } else { ex.hg=ag; ex.ag=hg; } }

}

function handleBracketSave(btn){
  const sp = getSport(btn.dataset.sport); if(!sp) return;
  const sd = getCurrentSeason(sp);
  if(!sd.bracket) return;
  const ri = parseInt(btn.dataset.round, 10), mid = btn.dataset.match;
  const round = sd.bracket[ri]; if(!round) return;
  const match = round.matches.find(m => m.id === mid); if(!match) return;
  if(!match.a || !match.b){ toast('این مسابقه هنوز تیم‌هاش مشخص نشده'); return; }
  const row = btn.closest('.bracket-match');
  const hgS = row.querySelector('[data-bracket="hg"]').value.trim(), agS = row.querySelector('[data-bracket="ag"]').value.trim();
  if(hgS === '' || agS === ''){ toast(t('fillScores')); return; }
  const hg = Math.max(0, Math.min(99, parseInt(hgS,10)||0));
  const ag = Math.max(0, Math.min(99, parseInt(agS,10)||0));
  if(hg === ag){ toast(t('knockoutNoDraw')); return; }
  match.hg = hg; match.ag = ag; match.winner = hg > ag ? 'a' : 'b';

function handleBracketClear(btn){

<script>

   بانوان: کلید فصل + "~w"                                  */
getCurrentSeason=function(sp){
  if(!sp.seasons.some(function(x){return x.id===sp.currentSeasonId;})) sp.currentSeasonId=sp.seasons[0].id;
  var k=gender==='women'?sp.currentSeasonId+'~w':sp.currentSeasonId;
  if(!sp.seasonsData[k]) sp.seasonsData[k]=emptySeasonData();
  var sd=sp.seasonsData[k];
  if(!sd.teamMembers) sd.teamMembers={};
  return sd;
};
var _ds=deleteSeason;
deleteSeason=function(sid,seid){
  var sp=getSport(sid); if(!sp) return;
  var before=sp.seasons.length; _ds(sid,seid);
  if(sp.seasons.length<before){ delete sp.seasonsData[seid+'~w']; save(); }
};

/* ---------- 3) ۵ نمره، جمع و رتبه‌بندی ---------- */
function soloArr(sd,id){
  sd.soloRounds=sd.soloRounds||{};
  var a=sd.soloRounds[id];
  return Array.isArray(a)&&a.length===5?a:[null,null,null,null,null];
}
function sumArr(a){return Math.round(a.reduce(function(s,v){return s+(Number(v)||0);},0)*100)/100;}
function ranks(rows){return rows.map(function(x,i){return i+1;});}
function fmt(v){return v==null||v===''?'—':num(v);}
function head5(){return '<th>'+t('rank')+'</th><th>'+t('team')+'</th>'+[1,2,3,4,5].map(function(i){return '<th>'+num(i)+'</th>';}).join('')+'<th>جمع</th>';}

  var body=rows.map(function(r,i){

    h+=ttl('📋 نتایج مسابقات')+(ws.length?tbl(['شرکت‌کننده اول','نتیجه','شرکت‌کننده دوم'],vsRows(sd,ws.map(function(x){

var RN={1:'فینال',2:'نیمه‌نهایی',4:'یک‌چهارم نهایی',8:'یک‌هشتم نهایی',16:'یک‌شانزدهم نهایی'};
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
generateFullBracket=function(sp){
  var sd=getCurrentSeason(sp), n=sd.teams.length; if(n<2) return false;
  var size=4; while(size<n) size*=2;
  var teams=shuf(sd.teams.slice()), m1=size/2, byes=size-n, idx=[];
  for(var i=0;i<m1;i++) idx.push(i);
  shuf(idx); var byeSet={}; idx.slice(0,byes).forEach(function(k){byeSet[k]=1;});
  var r1=[], p=0;
  for(var k=0;k<m1;k++){
    if(byeSet[k]){
      var tm=teams[p++].id, left=Math.random()<0.5;

      else mx.pairs.push({id:uid(),a:fr[j],b:null,hg:null,ag:null,winner:'a'});
    }
    save();render();
  }
  else if(a==='mpSave'){
    c=C(el); if(!c) return; var p=c.sd.mx.pairs.find(function(x){return x.id===el.dataset.id;}); if(!p) return;
    var r3=el.closest('.bracket-match'),x1=ival(r3,'[data-mp=hg]'),y1=ival(r3,'[data-mp=ag]');
    if(x1==null||y1==null){toast(t('fillScores'));return;} if(x1===y1){toast(t('knockoutNoDraw'));return;}
    p.hg=x1;p.ag=y1;p.winner=x1>y1?'a':'b';save();render();toast(t('saved'));
  }
  else if(a==='mpClear'){c=C(el);if(!c)return;var p2=c.sd.mx.pairs.find(function(x){return x.id===el.dataset.id;});if(p2){p2.hg=p2.ag=null;p2.winner=null;save();render();}}
  else if(a==='mpDel'){c=C(el);if(!c)return;c.sd.mx.pairs=c.sd.mx.pairs.filter(function(x){return x.id!==el.dataset.id;});save();render();}
  else if(a==='mxReset'){c=C(el);if(!c||!confirm('مرحله حذفی و گروه‌ها پاک شود؟'))return;c.sd.mx=null;c.sd.cup=null;save();render();}
});

/* ---------- 9) نسخه 1.6.0 ---------- */
/* 9-a) شطرنج و ورزش‌های «فقط برنده»: انتخاب برنده با تیک */
function tickify(){
  if(currentView!=='sport'||!authed||currentTab!=='admin') return;
  var sp=getSport(currentSportId); if(!sp||sp.type!=='winner') return;
  document.querySelectorAll('#view .bracket-match').forEach(function(row){
    var inp=row.querySelector('[data-bracket=hg],[data-third=hg],[data-man=hg]'); if(!inp) return;
    var kind=inp.hasAttribute('data-bracket')?'ko':inp.hasAttribute('data-third')?'third':'man';
    var ta=row.querySelector('.bm-team.a'), tb=row.querySelector('.bm-team.b'); if(!ta||!tb) return;
    var wa=ta.classList.contains('winner'), wb=tb.classList.contains('winner');
    var na=ta.innerText.trim(), nb=tb.innerText.trim();
    var can=!inp.disabled&&!/استراحت|در انتظار/.test(na+' '+nb);
    var at=' data-sport="'+sp.id+'"'+(kind==='ko'?' data-round="'+inp.dataset.round+'" data-match="'+inp.dataset.match+'"':kind==='man'?' data-id="'+row.dataset.mid+'"':'');
    var btn=function(w,on,nm){return '<button class="wr-chip '+(on?'on':'')+'" data-action="tickWin" data-kind="'+kind+'" data-w="'+w+'"'+at+(can?'':' disabled')+'>'+(on?'☑ ':'☐ ')+esc(nm)+'</button>';};
    row.style.cssText='display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap';
    row.innerHTML=btn('a',wa,na)+'<span class="bm-sep">vs</span>'+btn('b',wb,nb)+(kind==='man'?'<button class="rr-btn clear" data-action="manDel"'+at+'>✕</button>':'');
  });
}
function toggleWin(m,w){
  if(m.winner===w){m.winner=null;m.hg=m.ag=null;}
  else{m.winner=w;m.hg=w==='a'?1:0;m.ag=w==='a'?0:1;}
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action=tickWin]'); if(!el||el.disabled) return;
  var sp=getSport(el.dataset.sport); if(!sp) return; var sd=getCurrentSeason(sp), k=el.dataset.kind, w=el.dataset.w;
  if(k==='ko'){
    var ri=parseInt(el.dataset.round,10), m=sd.bracket[ri].matches.find(function(x){return x.id===el.dataset.match;}); if(!m) return;
    toggleWin(m,w);
    for(var r=ri+1;r<sd.bracket.length;r++) sd.bracket[r].matches.forEach(function(x){x.a=null;x.b=null;x.hg=null;x.ag=null;x.winner=null;});
    sd.champion=null; propagateBracket(sd);
  } else if(k==='third'){ if(!sd.third) return; toggleWin(sd.third,w); }
  else { var mm2=(sd.manualMatches||[]).find(function(x){return x.id===el.dataset.id;}); if(!mm2) return; toggleWin(mm2,w); }
  save(); render();
});
var _r9=render;
render=function(){_r9();tickify();};

/* ---------- 10) چیدمان دستی جدول حذفی ---------- */
function koSize(n){var z=4;while(z<n)z*=2;return z;}
function koManualCard(sp){
  var sd=getCurrentSeason(sp), n=sd.teams.length;
  if(n<2) return '';
  var size=koSize(n), m1=size/2, key=sp.currentSeasonId+gender;
  var h='<div class="card" style="margin-top:12px"><div class="section-title" style="margin:0 0 10px">✋ چیدمان دستی جدول</div>';
  if(ui.ko!==key) return h+'<p style="color:var(--muted);font-size:.8rem;margin-bottom:10px">جایگاه هر شرکت‌کننده را در جدول '+num(size)+' نفره خودتان تعیین کنید (جای خالی = استراحت).</p><button class="btn primary block" data-action="koManualOpen" data-sport="'+sp.id+'">✋ شروع چیدمان دستی</button></div>';
  var old=(sd.bracket&&sd.bracket[0]&&sd.bracket[0].matches.length===m1)?sd.bracket[0].matches:null;
  var opts=function(sel){return '<option value="">— استراحت —</option>'+sd.teams.map(function(x){return '<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>';}).join('');};
  var rows='';
  for(var i=0;i<m1;i++){
    var a,b;
    if(old){a=old[i].a;b=old[i].b;} else {a=sd.teams[2*i]?sd.teams[2*i].id:'';b=sd.teams[2*i+1]?sd.teams[2*i+1].id:'';}
    rows+='<div class="manual-match-row" style="grid-template-columns:auto 1fr auto 1fr"><b style="font-size:.75rem;color:var(--muted)">'+num(i+1)+'</b><select class="input" data-ks="'+i+'a">'+opts(a)+'</select><span class="rr-vs">vs</span><select class="input" data-ks="'+i+'b">'+opts(b)+'</select></div>';
  }
  return h+'<div class="hint-box" style="font-size:.75rem">جدول <b>'+num(size)+'</b> نفره • '+num(n)+' شرکت‌کننده • '+num(size-n)+' جای خالی (استراحت). برندگان بازی‌های ۱ و ۲، ۳ و ۴ و ... در دور بعد به هم می‌رسند. هر شرکت‌کننده فقط یک‌بار و هر بازی حداکثر یک استراحت می‌تواند داشته باشد.</div>'+rows+'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" data-action="koManualApply" data-sport="'+sp.id+'">✓ ساخت جدول با این چیدمان</button><button class="btn" data-action="koManualCancel">انصراف</button></div></div>';
}
var _rab=renderAdminBracket;
renderAdminBracket=function(sp){return _rab(sp)+koManualCard(sp);};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]'); if(!el) return; var a=el.dataset.action;
  if(a==='koManualOpen'){var sp=getSport(el.dataset.sport);if(!sp)return;ui.ko=sp.currentSeasonId+gender;render();}
  else if(a==='koManualCancel'){ui.ko=null;render();}
  else if(a==='koManualApply'){
    var sp2=getSport(el.dataset.sport); if(!sp2) return; var sd=getCurrentSeason(sp2), n=sd.teams.length, m1=koSize(n)/2;
    var used={}, r1=[];
    for(var i=0;i<m1;i++){
      var A=document.querySelector('[data-ks="'+i+'a"]').value, B=document.querySelector('[data-ks="'+i+'b"]').value;
      if(!A&&!B){toast('بازی '+num(i+1)+' نمی‌تواند هر دو جای خالی باشد');return;}
      if(A&&A===B){toast('در بازی '+num(i+1)+' یک نفر دو بار انتخاب شده است');return;}
      [A,B].forEach(function(id){if(id)used[id]=(used[id]||0)+1;});
      r1.push({id:uid(),a:A||null,b:B||null,hg:null,ag:null,winner:(A&&!B)?'a':((!A&&B)?'b':null)});
    }
    var dup=Object.keys(used).filter(function(k){return used[k]>1;});
    if(dup.length){var tm=sd.teams.find(function(x){return x.id===dup[0];});toast('«'+(tm?tm.name:'')+'» بیش از یک‌بار در جدول است');return;}
    if(Object.keys(used).length!==n){toast('همه '+num(n)+' شرکت‌کننده باید در جدول قرار بگیرند');return;}
    var played=sd.bracket&&sd.bracket.some(function(r){return r.matches.some(function(m){return m.hg!=null;});});
    if(played&&!confirm(t('confirmRegenerate'))) return;
    sd.bracket=buildRounds(r1);sd.champion=null;sd.third=null;propagateBracket(sd);
    ui.ko=null;save();render();toast('🏆 '+t('bracketGenerated'));
  }
});

/* ---------- 7) PWA: manifest + service worker ---------- */
(function(){
  function addLink(rel,href,extra){
    if(document.querySelector('link[rel="'+rel+'"]')) return;
    var l=document.createElement('link'); l.rel=rel; l.href=href;
    if(extra) for(var k in extra) l.setAttribute(k,extra[k]);
    document.head.appendChild(l);
  }
  function addMeta(name,content){
    if(document.querySelector('meta[name="'+name+'"]')) return;
    var m=document.createElement('meta'); m.name=name; m.content=content; document.head.appendChild(m);
  }
  addLink('manifest','manifest.json');
  addLink('apple-touch-icon','icon-192.png');
  addMeta('mobile-web-app-capable','yes');
  addMeta('apple-mobile-web-app-capable','yes');
  addMeta('apple-mobile-web-app-title','لیگ ورزش‌ها');
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    var reg=function(){navigator.serviceWorker.register('sw.js').catch(function(){});};
    if(document.readyState==='complete') reg(); else window.addEventListener('load',reg);
  }
})();

render();
})();
